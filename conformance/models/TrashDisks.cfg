\* expect: pass
\* module: MCTrash.tla
\* A disk lost or mounted read-only at any step: the link guard, restores and purges; a user deleting a copy,
\* unmounting a disk, mounting one read-only, or Atoll killed, three times in all.
SPECIFICATION Spec
CONSTANTS
    NFiles = 1
    Level = 2
    Guard = TRUE
    UserActs = {"del", "lose", "ro", "stop"}
    MaxUser = 3
    AtollActs = {"pass", "restore", "purge", "room"}
    MaxTime = 2
    Retention = 2
    NIno = 3
    MaxOps = 6
    Fixes = {}
INVARIANTS
    TypeOK
    NoKeptLost
    RestoreExact
    OneAtATime
    JournaledFirst
    PurgedStaysPurged
CHECK_DEADLOCK FALSE
