\* expect: pass
\* module: MCTrash.tla
\* Two files, an inode given again once its file is gone: the link guard and the purge; a user deleting a copy,
\* making a file, removing an entry of the trash by hand, or Atoll killed, three times in all.
SPECIFICATION Spec
CONSTANTS
    NFiles = 2
    Level = 2
    Guard = TRUE
    UserActs = {"del", "new", "trm", "stop"}
    MaxUser = 3
    AtollActs = {"pass", "purge"}
    MaxTime = 2
    Retention = 2
    NIno = 3
    MaxOps = 6
    Fixes = {}
INVARIANTS
    TypeOK
    NoKeptLost
    RestoreExact
    OneAtATime
    JournaledFirst
    PurgedStaysPurged
CHECK_DEADLOCK FALSE
