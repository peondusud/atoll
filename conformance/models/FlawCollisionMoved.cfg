\* expect: NoAtollPair
\* module: MCCollisions.tla
\* Flaw 24, open: Films/a on S, Other/a on S and N, a and A sharing a key; the plan places Films/a on N; a user
\* renames it to Other/A on S while its copy waits; the copy writes the path as it is then, beside Other/a.
SPECIFICATION Spec
CONSTANTS
    NFolders = 3
    NNames = 2
    SameNames = TRUE
    Fold = FALSE
    NFiles = 2
    StartPath <- PathsTwo
    StartN <- OnOther
    Acts = {"mv"}
    MaxActs = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoAtollPair
    WritesNoCollision
    CopiesAtTheirNames
CHECK_DEADLOCK FALSE
