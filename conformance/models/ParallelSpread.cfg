\* expect: pass
\* module: MCCopies.tla
\* Copies at once of one file to several disks (§14): one file on one SSD wanting two replicas, the two other SSDs its
\* targets, each copy read from the same source, which the per-path lock runs one at a time; a user writes into the
\* source in place once, at any moment, the power cut once, Atoll killed once, a disk lost and mounted again once.
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    NFiles = 1
    Size <- SizeUnit
    Cap <- CapRoom
    MinFree <- MinFreeOne
    Limit <- LimitFlash
    Total = 8
    Level = 3
    Start <- StartFirst
    MaxUser = 0
    FillBy = 1
    MaxView = 0
    MaxCrash = 1
    MaxCut = 1
    MaxDrop = 1
    MaxOps = 5
    MaxEdit = 1
    Fixes = {}
INVARIANTS
    TypeOK
    MinFreeKept
    CapacityKept
    OneCopyOfAFile
    LimitsKept
    Inv1_CopiesHold
    Inv7_PipelineOrder
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    LatestKept
    ReplicaInSync
CHECK_DEADLOCK FALSE
