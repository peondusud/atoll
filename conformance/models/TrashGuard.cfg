\* expect: pass
\* module: MCTrash.tla
\* The link guard: a user deleting or replacing a copy around Atoll, or Atoll killed, three times in all; the links
\* sent to the trash, removed and made at the end of each pass, and the purge for room dropping a link first.
SPECIFICATION Spec
CONSTANTS
    NFiles = 1
    Level = 2
    Guard = TRUE
    UserActs = {"del", "rep", "stop"}
    MaxUser = 3
    AtollActs = {"pass", "room"}
    MaxTime = 2
    Retention = 2
    NIno = 3
    MaxOps = 6
    Fixes = {}
INVARIANTS
    TypeOK
    NoKeptLost
    RestoreExact
    OneAtATime
    JournaledFirst
    PurgedStaysPurged
CHECK_DEADLOCK FALSE
