\* expect: ViewPresentsLatest
\* Flaw 9 (README.md): a new file the view makes lands on the cache disk 1, the original; the pass copies it to the data
\* disk 2, then its transfer moves the copy on the cache to the trash: until the commit of that move, the view presents
\* the file from the cache, where nothing is at its path any more, and reads nothing of it. The remedies are named in
\* Fixes: view-fallback, xfer-hide.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 1
    Phys <- PhysTwo
    Start <- StartNone
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 4
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {}
    ViewActs = {"create"}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 1
    CacheDisks = {1}
    Guard = "none"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv2_LastUserCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
    ViewPresentsLatest
CHECK_DEADLOCK FALSE
