\* expect: pass
\* module: MCConflicts.tla
\* A file in conflict, version 1 on disk 1, which the view presents, version 2 on disk 2: a user
\* writing, saving or deleting on either disk three times, a program writing through the view, a
\* disk lost once, and atoll conflicts resolve --keep either disk.
SPECIFICATION Spec
CONSTANTS
    StartVer <- VerTwo
    StartOrig = 1
    Corrupt = FALSE
    UserActs = {"write", "save", "delete"}
    MaxUser = 3
    MaxView = 1
    MaxDrop = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoVersionLost
    OnlyWhatItSays
    ViewNeverSentAway
CHECK_DEADLOCK FALSE
