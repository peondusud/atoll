\* lost, twice in all; a rebuild among the passes; Atoll killed once.
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    Cache = FALSE
    AtStart = {1, 2, 3}
    TrashAt = {3}
    UserActs = {"edit"}
    UserDisks = {1, 2}
    MaxUser = 1
    WorldActs = {"lose"}
    WorldDisks = {2, 3}
    MaxWorld = 2
    AtollActs = {"rebuild", "kill"}
    MaxKill = 1
    MaxRebuild = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    RebuiltConflict
    MissingNotEmpty
    PartsKept
    OldKept
CHECK_DEADLOCK FALSE
