\* expect: pass
\* module: MCFolders.tla
\* Flaw 14 (README.md), fixed: a folder D on two disks, D/x on both; a user renames D to E on one disk, and on the
\* other renames D to F and makes a new D, which may come between the look right before the folder's job there and
\* its rename. The look after finds the new D at E and puts it back at D, the operation undone and the job gone, or
\* kept by a stop, when the job takes only the folder its entry records (folder-back, the maintainer's remedy,
\* 2026-11-23). Until that remedy, the job carried the new D to E, and left it there.
SPECIFICATION Spec
CONSTANTS
    NFolders = 3
    NNames = 1
    NFiles = 1
    StartPath <- OnePath
    StartOn <- OneOn
    StartDirs <- DirsD
    ExDisks = {1, 2}
    MaxUser = 3
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 2
    UserActs = {"mvdir", "mkdir"}
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv4_UnknownNeverAbsent
    Inv7_RenameDurable
    NamesKept
    RenamesAreUsers
    OneRowAnObject
CHECK_DEADLOCK FALSE
