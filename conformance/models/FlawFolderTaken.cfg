\* expect: NamesKept
\* module: MCFolders.tla
\* Flaw 14, open: a folder D on two disks, D/x on both; a user renames D to E on one disk, and on the other renames D
\* to F and makes a new D, which may come between the look right before the folder's job there and its rename: the
\* job carries the new D to E, and leaves it there (README.md). With folder-back in Fixes, it passes.
SPECIFICATION Spec
CONSTANTS
    NFolders = 3
    NNames = 1
    NFiles = 1
    StartPath <- OnePath
    StartOn <- OneOn
    StartDirs <- DirsD
    ExDisks = {1, 2}
    MaxUser = 3
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 2
    UserActs = {"mvdir", "mkdir"}
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv4_UnknownNeverAbsent
    Inv7_RenameDurable
    NamesKept
    RenamesAreUsers
    OneRowAnObject
CHECK_DEADLOCK FALSE
