    Coarse = {}
    Unverified = {}
    Mode = "chunk"
    UserActs = {"edit"}
    UserDisks = {3}
    MaxUser = 1
    WorldActs = {"rot"}
    WorldDisks = {1, 2}
    MaxWorld = 2
    AtollActs = {"scrub", "budget"}
    MaxKill = 0
    Fixes = {}
