\* expect: pass
\* module: MCFolders.tla
\* Flaw 13 (README.md), fixed: D/x and D/y on two disks; a user swaps their names on one disk, and saves a file at
\* one of the two names on the other, which may come between the look right before the exchange and the exchange.
\* The look after finds it at the other name, and the two names are exchanged back, both renames undone
\* (exchange-back, the maintainer's remedy, 2026-11-23). Until that remedy, the file saved followed the exchange to
\* the other name, and stayed there.
SPECIFICATION Spec
CONSTANTS
    NFolders = 1
    NNames = 2
    NFiles = 2
    StartPath <- TwoPath
    StartOn <- TwoOn
    StartDirs <- DirsD
    ExDisks = {1, 2}
    MaxUser = 2
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 2
    UserActs = {"swap", "replace"}
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv4_UnknownNeverAbsent
    Inv7_RenameDurable
    NamesKept
    RenamesAreUsers
    OneRowAnObject
CHECK_DEADLOCK FALSE
