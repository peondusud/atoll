\* expect: NamesKept
\* module: MCFolders.tla
\* Flaw 13, open: D/x and D/y on two disks; a user swaps their names on one disk, and saves a file at one of the two
\* names on the other, which may come between the look right before the exchange and the exchange: the file saved
\* follows the exchange to the other name, and stays there (README.md). With exchange-back in Fixes, it passes.
SPECIFICATION Spec
CONSTANTS
    NFolders = 1
    NNames = 2
    NFiles = 2
    StartPath <- TwoPath
    StartOn <- TwoOn
    StartDirs <- DirsD
    ExDisks = {1, 2}
    MaxUser = 2
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 2
    UserActs = {"swap", "replace"}
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv4_UnknownNeverAbsent
    Inv7_RenameDurable
    NamesKept
    RenamesAreUsers
    OneRowAnObject
CHECK_DEADLOCK FALSE
