\* expect: pass
\* module: MCDisks.tla
\* The commands while the world acts, with every remedy: the spare; a file on disks 1 and 2; disk 1 or 2 drained,
\* failed, replaced or taken out; unplugged, unmounted by systemd or by hand, dead, or mounted read-only, and
\* mounted again by the daemon, once; a user editing the file on disk 1 or 3, there or away; Atoll killed once.
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    Spare = TRUE
    SpareClone = FALSE
    SpareShares = FALSE
    Level = 1
    Holders = {1, 2}
    Fuse = FALSE
    Remount = TRUE
    UserActs = {"edit", "away"}
    UserDisks = {1, 3}
    MaxUser = 1
    WorldActs = {"unplug", "idle", "umount", "die", "ro"}
    WorldDisks = {1, 2}
    MaxWorld = 1
    AtollActs = {"pass", "kill", "grace", "remount"}
    MaxKill = 1
    CmdActs = {"drain", "fail", "remove", "replace"}
    CmdDisks = {1, 2}
    MaxCmd = 2
    Fixes = {"remove-looks", "failed-ops-undone", "failed-remove-drops"}
INVARIANTS
    TypeOK
    Inv3_WritesConfirmed
    NoCopyOntoLeaving
    Inv4_UnknownNeverAbsent
    NoLastCopyLost
    OneIdOneDisk
    OnePhysicalDisk
CHECK_DEADLOCK FALSE
