\* expect: pass
\* module: MCDisks.tla
\* What the world does to a disk, without a command: disk 1 unplugged, failing, unmounted by systemd or by hand,
\* given another filesystem or a clone, mounted read-only, held, mounted again by the daemon after a reset;
\* ntfs-3g's dead superblock; a user editing the file on disk 2; Atoll killed once.
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    Spare = FALSE
    SpareClone = FALSE
    SpareShares = FALSE
    Level = 1
    Holders = {1, 2}
    Fuse = TRUE
    Remount = TRUE
    UserActs = {"edit", "away"}
    UserDisks = {1, 2}
    MaxUser = 1
    WorldActs = {"unplug", "eio", "idle", "umount", "other", "clone", "ro", "marker", "hold"}
    WorldDisks = {1}
    MaxWorld = 3
    AtollActs = {"pass", "kill", "grace", "remount"}
    MaxKill = 1
    CmdActs = {}
    CmdDisks = {}
    MaxCmd = 0
    Fixes = {}
INVARIANTS
    TypeOK
    Inv3_WritesConfirmed
    NoCopyOntoLeaving
    Inv4_UnknownNeverAbsent
    NoLastCopyLost
    OneIdOneDisk
    OnePhysicalDisk
CHECK_DEADLOCK FALSE
