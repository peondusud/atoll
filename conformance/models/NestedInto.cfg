\* expect: pass
\* module: MCNested.tla
\* D and E on both disks, D holding a file: a user acting twice, on either disk, moving a folder anywhere
\* (into another, out of one, or renamed), making one, or moving the file; Atoll killed once, a disk lost
\* once.
SPECIFICATION Spec
CONSTANTS
    NNames = 2
    NFiles = 2
    StartDirs <- DirsDE
    StartFile <- FileD
    StartOn <- OnD
    Refuse <- RefuseNone
    UserActs = {"mvdir", "mkdir", "mv"}
    UserDisks = {1, 2}
    MaxUser = 2
    MaxCrash = 1
    MaxDrop = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    LastCopyKept
    RenamesAreUsers
    OneRowAnObject
CHECK_DEADLOCK FALSE
