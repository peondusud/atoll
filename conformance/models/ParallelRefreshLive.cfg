\* expect: pass
\* module: MCCopies.tla
\* Liveness: one file at three copies on three SSDs, a user writing into one once, Atoll killed once: the two stale
\* copies reach the trash and are refreshed, every copy holding the current content, and nothing stays planned.
SPECIFICATION FairSpec
CONSTANTS
    NDisks = 3
    NFiles = 1
    Size <- SizeUnit
    Cap <- CapRoom
    MinFree <- MinFreeOne
    Limit <- LimitFlash
    Total = 8
    Level = 3
    Start <- StartAll
    MaxUser = 0
    FillBy = 1
    MaxView = 0
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 6
    MaxEdit = 1
    Fixes = {}
INVARIANTS
    TypeOK
    OneCopyOfAFile
    Inv1_CopiesHold
    LatestKept
PROPERTIES
    EventuallySettled
CHECK_DEADLOCK FALSE
