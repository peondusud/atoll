\* expect: pass
\* module: MCNested.tla
\* D on both disks, with a file: a user acting three times, as D renamed to E, a new D made and E moved
\* into it, which moves the job D to E on to D/E, below its own old name; Atoll killed once, a disk lost
\* once.
SPECIFICATION Spec
CONSTANTS
    NNames = 2
    NFiles = 2
    StartDirs <- DirsD
    StartFile <- FileD
    StartOn <- OnD
    Refuse <- RefuseNone
    UserActs = {"mvdir", "mkdir", "mv"}
    UserDisks = {1, 2}
    MaxUser = 3
    MaxCrash = 1
    MaxDrop = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    LastCopyKept
    RenamesAreUsers
    OneRowAnObject
CHECK_DEADLOCK FALSE
