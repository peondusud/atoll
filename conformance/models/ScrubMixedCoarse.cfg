\* expect: pass
\* module: MCScrub.tla
\* Two disks, disk 1's change time in whole ticks: a user editing the copy on disk 1, keeping its modification
\* time or not, twice in all; rot or a read wrong once on disk 1 or 2, twice in all; the scrub, its budget, its
\* repair by chunk, a pass; Atoll killed once.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    Coarse = {1}
    Unverified = {}
    Mode = "chunk"
    UserActs = {"edit", "keep"}
    UserDisks = {1}
    MaxUser = 2
    WorldActs = {"rot", "flip"}
    WorldDisks = {1, 2}
    MaxWorld = 2
    AtollActs = {"scrub", "pass", "budget", "kill"}
    MaxKill = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoEditCalledCorrupt
    NoEditRepairedAway
    TrashFirst
    SourceVerified
    NoWrongVerify
    LastKept
    SoundNeverCorrupt
CHECK_DEADLOCK FALSE
