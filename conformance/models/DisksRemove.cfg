\* expect: pass
\* module: MCDisks.tla
\* disk remove, its drain and disk fail: disk 1 drained, failed or taken out, a user editing
\* the file on it, disk 2 unplugged or dead, or Atoll killed, two times in all.
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    Spare = FALSE
    SpareClone = FALSE
    SpareShares = FALSE
    Level = 1
    Holders = {1, 2, 3}
    Fuse = FALSE
    Remount = FALSE
    UserActs = {"edit"}
    UserDisks = {1}
    MaxUser = 1
    WorldActs = {"unplug", "die"}
    WorldDisks = {2}
    MaxWorld = 1
    AtollActs = {"pass", "kill"}
    MaxKill = 1
    CmdActs = {"drain", "fail", "remove"}
    CmdDisks = {1}
    MaxCmd = 2
    Fixes = {}
INVARIANTS
    TypeOK
    Inv3_WritesConfirmed
    NoCopyOntoLeaving
    Inv4_UnknownNeverAbsent
    NoLastCopyLost
    OneIdOneDisk
    OnePhysicalDisk
CHECK_DEADLOCK FALSE
