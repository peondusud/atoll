\* expect: pass
\* A file at its level on two disks, deleted through Atoll's own view (§21.2), with atoll mount stopped short once,
\* the daemon killed once and a disk lost once, at any step: the deletion left planned for the view's reprise, then
\* taken by the passes to the other copy.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartTwo
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 3
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {}
    ViewActs = {"delete"}
    Parallel = FALSE
    MaxStop = 1
    MaxVOps = 2
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
    ViewPresentsLatest
CHECK_DEADLOCK FALSE
