\* expect: ViewNamesSettled
\* module: MCViewNames.tla
\* Flaw 23, open: D/x on both disks and D/y on disk 2 alone; the folder D renamed through the view to E, then back to
\* D while disk 1 is lost: disk 1, back, holds the folder at E, and its walk reads the first rename as a user's, which
\* takes D/y to E, where it stays (README.md).
SPECIFICATION Spec
CONSTANTS
    NFolders = 2
    NNames = 2
    NFiles = 2
    StartPath <- AlonePath
    StartOn <- AloneOn
    StartDirs <- DirsD
    Direct = "propagate"
    ViewActs = {"mvdir"}
    MaxView = 2
    UserActs = {}
    MaxUser = 0
    MaxStop = 0
    MaxDrop = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
    ViewNamesSettled
CHECK_DEADLOCK FALSE
