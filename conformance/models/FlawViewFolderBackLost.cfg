    NNames = 2
    NFiles = 2
    StartPath <- AlonePath
    StartOn <- AloneOn
    StartDirs <- DirsD
    Direct = "propagate"
    ViewActs = {"mvdir"}
    MaxView = 2
    UserActs = {}
    MaxUser = 0
    MaxStop = 0
    MaxDrop = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
    ViewNamesSettled
CHECK_DEADLOCK FALSE
