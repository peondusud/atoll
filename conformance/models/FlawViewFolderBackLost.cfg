\* expect: pass
\* module: MCViewNames.tla
\* Flaw 23: D/x on both disks and D/y on disk 2 alone; the folder D renamed through the view to E, then back to D
\* while either disk is lost: that disk, back, holds the folder at E; fixed on 2026-11-24 with the maintainer's
\* remedy, the pass making the rename there, a regression instance (README.md). Before, its walk read the first
\* rename as a user's, which took D/y to E, where it stayed (ViewNamesSettled).
SPECIFICATION Spec
CONSTANTS
    NFolders = 2
    NNames = 2
    NFiles = 2
    StartPath <- AlonePath
    StartOn <- AloneOn
    StartDirs <- DirsD
    Direct = "propagate"
    ViewActs = {"mvdir"}
    MaxView = 2
    UserActs = {}
    MaxUser = 0
    MaxStop = 0
    MaxDrop = 1
    Fixes = {}
INVARIANTS
    ViewReadable
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
    ViewNamesSettled
CHECK_DEADLOCK FALSE
