\* expect: ViewNamesSettled
\* module: MCViewNames.tla
\* Flaw 23, open: D/x on both disks and D/y on disk 2 alone; the folder D renamed through the view to E, then back to
\* D while disk 1 is lost: disk 1, back, holds the folder at E, and its walk reads the first rename as a user's, which
\* takes D/y to E, where it stays (README.md). With back-pass and back-files in Fixes, what ends the code's test,
\* it passes, with fairness too; with back-follow, alone or with back-files, too, though not in the code, which
\* splits the file; with back-wait or back-pass alone, it breaks ViewNamesSettled all the same; with back-files
\* alone, the rename back is never taken in.
SPECIFICATION Spec
