\* expect: NoVersionLost
\* module: MCConflicts.tla
\* Flaw 26, open: a file in conflict, version 1 on disk 1, which the view presents, version 2 on disk 2; a program
\* opens it through the view to write; atoll conflicts resolve --keep 2 sends disk 1's copy to the trash; what
\* the program writes then goes there, a version no resolve said it sends away.
SPECIFICATION Spec
CONSTANTS
    StartVer <- VerTwo
    StartOrig = 1
    Corrupt = FALSE
    UserActs = {}
    MaxUser = 0
    MaxView = 1
    MaxDrop = 0
    Fixes = {}
INVARIANTS
    TypeOK
    NoVersionLost
    OnlyWhatItSays
    ViewNeverSentAway
CHECK_DEADLOCK FALSE
