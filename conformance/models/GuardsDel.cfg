\* expect: pass
\* module: MCGuards.tla
\* Deletions: two files on D and E, the mass-deletion guard tripping past one; a user deleting, putting
\* back, editing on E, unmounting D, or the daemon stopping, four times in all; confirm and reject.
SPECIFICATION Spec
CONSTANTS
    NFiles = 2
    DelFiles = 1
    DelWin = 2
    ModFiles = 9
    ModWin = 2
    DayFiles = 9
    DayWin = 4
    UserActs = {"del", "back", "edit", "drop"}
    MaxUser = 4
    MaxTime = 4
    AnswerActs = {"dconfirm", "dreject"}
    Fixes = {}
INVARIANTS
    TypeOK
    DelBounded
    ModBounded
    DayBounded
    NoTrashHeld
    NoTrashRefused
    NoOverwriteHeld
    NoOverwriteRefused
CHECK_DEADLOCK FALSE
