\* expect: pass
\* module: MCViewMove.tla
\* A new file the view made on a full disk, written through it, whose next write that disk answers with ENOSPC: the
\* move to the other disk, step by step, the copy left sent to its trash and purged, or removed at its path when that
\* trash has no room; the program's write then made on the target. A user acting once directly on either disk,
\* atoll mount stopped once, the power cut once, a disk lost and mounted again once, between any two steps. It takes
\* move-held, the remedy proposed for flaw 15, still open, so that it looks past it (README.md).
SPECIFICATION Spec
CONSTANTS
    MaxUser = 1
    UserActs = {"write", "rewrite", "delete"}
    MaxWrite = 2
    MaxStop = 1
    MaxCut = 1
    MaxDrop = 1
    NoRoom = TRUE
    MaxOps = 3
    Fixes = {"move-held", "move-look"}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv2_MovedFirst
    ViewPresentsLatest
    Inv12_JournalFirst
CHECK_DEADLOCK FALSE
