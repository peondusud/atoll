    AtollActs = {"pass", "restore", "room"}
    MaxTime = 2
    Retention = 2
    NIno = 3
    MaxOps = 6
    Fixes = {}
INVARIANTS
    TypeOK
PROPERTIES
    PurgeSettles
CHECK_DEADLOCK FALSE
