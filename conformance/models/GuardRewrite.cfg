\* expect: pass
\* The link guard and a write that keeps the size and the dates (§14.2, §17, §17.2): a file to replicate from disk 1 to
\* disk 2, each copy given its link; a user rewrites a copy, which moves only its change time, at any moment, Atoll
\* killed once, a disk lost once: the change time a link gives the copy's row never hides the write. The remedy of flaw
\* 11 in Fixes (README.md).
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartOne
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 6
    Waits = TRUE
    Grace = FALSE
    Fixes = {"link-keep"}
    UserActs = {"rewrite"}
    ViewActs = {}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 0
    CacheDisks = {}
    Guard = "on"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
CHECK_DEADLOCK FALSE
