\* expect: pass
\* module: MCCopies.tla
\* Flaw 12 (README.md), fixed: two copies queued to the SSD fill its room past min_free, and the view writes a part
\* there meanwhile. The view's room takes off what the pending copies still have to write (view-room, §21.2), and
\* each copy checks min_free as it writes (copy-room, §14.2); until those remedies, the view measured its room with
\* the pending copies not counted, and the copies then took the disk past min_free.
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    NFiles = 2
    Size <- SizeOne
    Cap <- CapThree
    MinFree <- MinFreeOne
    Limit <- LimitSSD
    Total = 8
    Level = 2
    Start <- StartApart
    MaxUser = 0
    FillBy = 1
    MaxView = 1
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 4
    MaxEdit = 0
    Fixes = {}
INVARIANTS
    TypeOK
    MinFreeKept
    CapacityKept
    OneCopyOfAFile
    LimitsKept
    Inv1_CopiesHold
    Inv7_PipelineOrder
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
CHECK_DEADLOCK FALSE
