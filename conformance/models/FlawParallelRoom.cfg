\* expect: MinFreeKept
\* module: MCCopies.tla
\* Flaw 12 (README.md): the room of a disk is shared by the daemon's copies, which the plan made fit past min_free with
\* the pending copies holding their room, and the parts Atoll's own view writes in parallel, which measure their room
\* past min_free as the filesystem says it, the pending copies not counted. Two copies queued to the SSD fill its room;
\* the view writes a part there meanwhile; the copies then take the disk past min_free. The remedies are named in
\* Fixes: view-room, copy-room.
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    NFiles = 2
    Size <- SizeOne
    Cap <- CapThree
    MinFree <- MinFreeOne
    Limit <- LimitSSD
    Total = 8
    Level = 2
    Start <- StartApart
    MaxUser = 0
    FillBy = 1
    MaxView = 1
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 4
    Fixes = {}
INVARIANTS
    TypeOK
    MinFreeKept
    CapacityKept
    OneCopyOfAFile
    LimitsKept
    Inv1_CopiesHold
    Inv7_PipelineOrder
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
CHECK_DEADLOCK FALSE
