\* expect: pass
\* module: MCTrash.tla
\* Deletions and modifications to the trash, purged by their expiry and for room: one file on two disks; a user
\* deleting, replacing or editing a copy, unmounting a disk, or Atoll killed, three times in all.
SPECIFICATION Spec
CONSTANTS
    NFiles = 1
    Level = 2
    Guard = FALSE
    UserActs = {"del", "rep", "edit", "lose", "stop"}
    MaxUser = 3
    AtollActs = {"pass", "purge", "room"}
    MaxTime = 2
    Retention = 2
    NIno = 3
    MaxOps = 5
    Fixes = {}
INVARIANTS
    TypeOK
    NoKeptLost
    RestoreExact
    OneAtATime
    JournaledFirst
    PurgedStaysPurged
CHECK_DEADLOCK FALSE
