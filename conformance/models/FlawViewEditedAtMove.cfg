\* expect: Inv10_DeletionOnlyUnchangedToTrash
\* Flaw 4 (README.md), open: a deletion through Atoll's own view whose copy a user edits directly on its disk between
\* the look right before the move and the move. The look after the move finds the trash's name holding another size
\* and time, and the view undoes the operation as it is (writer.toTrash calls no ResolveNow): the user's latest version
\* stays in the trash, with no row there, where §17.1 resolves it at once by the table of §17.2, which puts it back at
\* its path. Fixes = {"view-resolve"} takes that remedy, and passes.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartTwo
    LinkDisks = {}
    MaxUser = 2
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 3
    Waits = TRUE
    Grace = FALSE
    Fixes = {"view-reprise", "view-recheck"}
    UserActs = {"modify"}
    ViewActs = {"delete"}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 1
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    ReplicaInSync
    DoubtUnverified
    ViewPresentsLatest
CHECK_DEADLOCK FALSE
