\* expect: pass
\* module: MCScrub.tla
\* The repair by file: rot or an unreadable sector on disk 1, the copy sent to the trash and made again; a user
\* editing either copy; disk 2 lost once.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    Coarse = {}
    Unverified = {}
    Mode = "file"
    UserActs = {"edit", "keep"}
    UserDisks = {1, 2}
    MaxUser = 1
    WorldActs = {"rot", "sector", "lose"}
    WorldDisks = {1, 2}
    MaxWorld = 2
    AtollActs = {"scrub", "pass"}
    MaxKill = 0
    Fixes = {"repair-recheck"}
INVARIANTS
    TypeOK
    NoEditCalledCorrupt
    NoEditRepairedAway
    TrashFirst
    SourceVerified
    NoWrongVerify
    LastKept
    SoundNeverCorrupt
CHECK_DEADLOCK FALSE
