\* expect: pass
\* module: MCNested.tla
\* D on both disks, with a file, disk 2 refusing the name E (as NTFS a name with ":"): a user acting
\* three times, on either disk; Atoll killed once, a disk lost once: the folder's job refused, the copy
\* left behind, and its trash job once the other copy is at the file's path.
SPECIFICATION Spec
CONSTANTS
    NNames = 2
    NFiles = 2
    StartDirs <- DirsD
    StartFile <- FileD
    StartOn <- OnD
    Refuse <- RefuseE2
    UserActs = {"mvdir", "mkdir", "mv"}
    UserDisks = {1, 2}
    MaxUser = 3
    MaxCrash = 1
    MaxDrop = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    LastCopyKept
    RenamesAreUsers
    OneRowAnObject
CHECK_DEADLOCK FALSE
