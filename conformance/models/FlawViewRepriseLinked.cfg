\* expect: pass
\* Flaw 3 (README.md), fixed: a deletion through Atoll's own view, on disks without RENAME_NOREPLACE, stopped short
\* between its link and its unlink. The view's reprise resolves it by the table of §17.2 (ops.ResolveViewTrash), which
\* removes the copy's name in the library; it once called the deletion done on the inode the trash's name held, and
\* left the copy at its name (writer.resolve).
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartTwo
    LinkDisks = {1, 2}
    MaxUser = 1
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 3
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {}
    ViewActs = {"delete"}
    Parallel = FALSE
    MaxStop = 1
    MaxVOps = 1
    CacheDisks = {}
    Guard = "none"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    ReplicaInSync
    DoubtUnverified
    ViewPresentsLatest
CHECK_DEADLOCK FALSE
