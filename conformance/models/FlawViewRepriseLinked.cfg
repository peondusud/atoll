\* expect: Inv7_PipelineOrder
\* Flaw 3 (README.md), open: a deletion through Atoll's own view, on disks without RENAME_NOREPLACE, stopped short
\* between its link and its unlink. The view's reprise finds the trash's name holding the copy's inode and calls the
\* deletion done, leaving the copy at its name in the library (writer.resolve), where §21.2 resolves it by the table of
\* §17.2, which removes the source's name. Fixes = {"view-reprise"} takes that remedy, and passes.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartTwo
    LinkDisks = {1, 2}
    MaxUser = 1
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 3
    Waits = TRUE
    Grace = FALSE
    Fixes = {"view-resolve", "view-recheck"}
    UserActs = {}
    ViewActs = {"delete"}
    Parallel = FALSE
    MaxStop = 1
    MaxVOps = 1
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    ReplicaInSync
    DoubtUnverified
    ViewPresentsLatest
CHECK_DEADLOCK FALSE
