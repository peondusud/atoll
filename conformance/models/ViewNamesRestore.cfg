\* expect: pass
\* module: MCViewNames.tla
\* ViewNames with deletes.direct at restore. It takes the remedies proposed for flaws 18 to 22, still open, so that it looks past them (README.md).
SPECIFICATION Spec
CONSTANTS
    NFolders = 1
    NNames = 2
    NFiles = 2
    StartPath <- TwoPath
    StartOn <- TwoOn
    StartDirs <- DirsD
    Direct = "restore"
    ViewActs = {"rename", "replace"}
    MaxView = 1
    UserActs = {"mv", "create", "delete", "save", "write"}
    MaxUser = 1
    MaxStop = 1
    MaxDrop = 1
    Fixes = {"replace-gone", "folder-key", "view-moot", "job-view-held"}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
CHECK_DEADLOCK FALSE
