\* expect: pass
\* module: MCFolders.tla
\* Liveness: a folder D on two disks, D/x on both and D/y on disk 2 alone, renamed by a user on one disk; Atoll killed
\* once, a disk lost once and mounted again in time: every copy follows, the job runs, and nothing stays planned.
SPECIFICATION FairSpec
CONSTANTS
    NFolders = 2
    NNames = 2
    NFiles = 3
    StartPath <- JobPath
    StartOn <- JobOn
    StartDirs <- DirsD
    ExDisks = {1, 2}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 4
    UserActs = {"mvdir"}
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    NamesKept
    RenamesAreUsers
PROPERTIES
    EventuallyFollowed
CHECK_DEADLOCK FALSE
