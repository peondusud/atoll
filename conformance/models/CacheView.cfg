\* expect: pass
\* The SSD cache with Atoll's own view (§19, §21.2): a new file the view makes lands on the cache disk 1, then is written
\* through the view; the pass records it and copies it to the data disk 2, and its transfer waits while an operation of
\* the view no pass has taken in touches its path, then sends the copy on the cache to the trash and purges it. Atoll
\* killed once, atoll mount stopped short once. The remedies of flaws 8 to 10 in Fixes (README.md).
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 1
    Phys <- PhysTwo
    Start <- StartNone
    LinkDisks = {}
    MaxUser = 2
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 4
    Waits = TRUE
    Grace = FALSE
    Fixes = {"xfer-look", "view-fallback", "view-held"}
    UserActs = {}
    ViewActs = {"create", "write"}
    Parallel = FALSE
    MaxStop = 1
    MaxVOps = 2
    CacheDisks = {1}
    Guard = "none"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv2_LastUserCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
    ViewPresentsLatest
CHECK_DEADLOCK FALSE
