\* expect: pass
\* module: MCDisks.tla
\* Liveness: disk 1 unplugged, unmounted by systemd, or failing, held by the view, mounted again by the daemon:
\* ntfs-3g's dead superblock, or dead for good; the disk comes back, or its copy is made again past the grace.
SPECIFICATION LiveSpec
CONSTANTS
    NDisks = 3
    Spare = FALSE
    SpareClone = FALSE
    SpareShares = FALSE
    Level = 1
    Holders = {1, 2}
    Fuse = TRUE
    Remount = TRUE
    UserActs = {}
    UserDisks = {}
    MaxUser = 0
    WorldActs = {"unplug", "eio", "idle", "hold", "die"}
    WorldDisks = {1}
    MaxWorld = 2
    AtollActs = {"pass", "grace", "remount"}
    MaxKill = 0
    CmdActs = {}
    CmdDisks = {}
    MaxCmd = 0
    Fixes = {}
INVARIANTS
    TypeOK
PROPERTIES
    EventuallySettled
CHECK_DEADLOCK FALSE
