\* expect: pass
\* Flaw 10 (README.md), fixed: a new file the view makes lands on the cache disk 1, the original, and the pass copies
\* it to the data disk 2. A program opens it to write through the view as the transfer moves it: the transfer reads
\* the view's operations again in the transaction that journals the move, the view's open to write waits while the
\* move is planned, and no pass takes in an operation the view holds open (view-held, §19, §21.2). Until those
\* remedies, the copy on the cache, as its row said, went to the trash and was purged, and what the program wrote
\* then went to a file no name held any more.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 1
    Phys <- PhysTwo
    Start <- StartNone
    LinkDisks = {}
    MaxUser = 2
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 4
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {}
    ViewActs = {"create", "write"}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 2
    CacheDisks = {1}
    Guard = "none"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv2_LastUserCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
    ViewPresentsLatest
CHECK_DEADLOCK FALSE
