\* expect: NoUserDataLost
\* Flaw 10 (README.md): a new file the view makes lands on the cache disk 1, the original, and the pass copies it to the
\* data disk 2. A program opens it to write through the view after the transfer read the view's operations: the copy on
\* the cache, as its row says, goes to the trash and is purged, and what the program writes then goes to a file no name
\* holds any more. The remedies of flaws 8 and 9 are in, so that it looks past them; ViewPresentsLatest, which breaks
\* first here (the view presents the file from the cache, where nothing is), is left out to show the loss. The remedy is
\* named in Fixes: view-held.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 1
    Phys <- PhysTwo
    Start <- StartNone
    LinkDisks = {}
    MaxUser = 2
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 4
    Waits = TRUE
    Grace = FALSE
    Fixes = {"xfer-look", "view-fallback"}
    UserActs = {}
    ViewActs = {"create", "write"}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 2
    CacheDisks = {1}
    Guard = "none"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv2_LastUserCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
CHECK_DEADLOCK FALSE
