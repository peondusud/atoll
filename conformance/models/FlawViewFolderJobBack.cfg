    NFolders = 2
    NNames = 1
    NFiles = 1
    StartPath <- OnePath
    StartOn <- OneOn
    StartDirs <- DirsD
    Direct = "propagate"
    ViewActs = {"mvdir"}
    MaxView = 2
    UserActs = {}
    MaxUser = 0
    MaxStop = 0
    MaxDrop = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
CHECK_DEADLOCK FALSE
