\* expect: pass
\* The maintainer's decision of 2026-11-21 (README.md, "Inode + taille + mtime"): a copy going to the trash on a disk
\* without RENAME_NOREPLACE, written through its name in the library while its link in the trash shares it, then that
\* name deleted, before the look at the source. The look after the move, or the reprise after a kill, finds the link
\* holding the copy's object with another change count than its row's: not the copy, it goes back to its path rather
\* than stay in the trash as the copy. Three user actions, as one more than Link.cfg's is what it takes to reach that.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartTwo
    LinkDisks = {1, 2}
    MaxUser = 3
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 4
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {"modify", "delete"}
    ViewActs = {}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 0
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
CHECK_DEADLOCK FALSE
