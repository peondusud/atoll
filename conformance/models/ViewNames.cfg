\* expect: pass
\* module: MCViewNames.tla
\* D/x and D/y on both disks: the view renames them or replaces one by the other, twice at most; a user acting once
\* directly on either disk (a move, a new file, a deletion, an atomic save, a write in place); atoll mount stopped
\* once, a disk lost once; the passes taking it to the other disk and in.
SPECIFICATION Spec
CONSTANTS
    NFolders = 1
    NNames = 2
    NFiles = 2
    StartPath <- TwoPath
    StartOn <- TwoOn
    StartDirs <- DirsD
    Direct = "propagate"
    ViewActs = {"rename", "replace"}
    MaxView = 2
    UserActs = {"mv", "create", "delete", "save", "write"}
    MaxUser = 1
    MaxStop = 1
    MaxDrop = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
CHECK_DEADLOCK FALSE
