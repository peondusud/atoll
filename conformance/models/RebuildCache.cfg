    NDisks = 3
    Cache = TRUE
    AtStart = {1}
    TrashAt = {}
    UserActs = {}
    UserDisks = {}
    MaxUser = 0
    WorldActs = {"lose", "readonly"}
    WorldDisks = {1, 2, 3}
    MaxWorld = 2
    AtollActs = {"rebuild", "kill"}
    MaxKill = 1
    MaxRebuild = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    RebuiltConflict
    MissingNotEmpty
    PartsKept
    OldKept
CHECK_DEADLOCK FALSE
