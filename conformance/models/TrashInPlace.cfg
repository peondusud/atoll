\* expect: pass
\* module: MCTrash.tla
\* The view's move when the trash has no room, the copy removed at its path after its look: disk 1's copy
\* surplus; a user deleting or editing a copy, unmounting a disk, or Atoll killed, three times in all.
SPECIFICATION Spec
CONSTANTS
    NFiles = 1
    Level = 1
    Guard = FALSE
    UserActs = {"del", "edit", "lose", "stop"}
    MaxUser = 3
    AtollActs = {"pass", "prune", "inplace", "purge"}
    MaxTime = 2
    Retention = 2
    NIno = 3
    MaxOps = 5
    Fixes = {}
INVARIANTS
    TypeOK
    NoKeptLost
    RestoreExact
    OneAtATime
    JournaledFirst
    PurgedStaysPurged
CHECK_DEADLOCK FALSE
