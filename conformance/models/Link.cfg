\* expect: pass
\* Propagate.cfg on disks whose driver lacks RENAME_NOREPLACE, as ntfs-3g: every move is a link, a sync, a look
\* and an unlink (specs.md §17.1), so both names lead to a file between them, and a reprise finds them so.
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    NFiles = 1
    Level = 2
    Phys <- PhysShared
    Start <- StartTwo
    LinkDisks = {1, 2, 3}
    MaxUser = 2
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 4
    Waits = TRUE
    Grace = TRUE
    Fixes = {}
    UserActs = {"modify", "replace", "delete", "create"}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
CHECK_DEADLOCK FALSE
