\* expect: pass
\* module: MCFolders.tla
\* D/x and D/y on two disks, the folder D alone; two moves by a user on either disk at any moment, as a chain: D/y to
\* E/y, then D/x to D/y, the second taking the name the first frees, which the pass renames round after round, E made
\* on the other disk first. Atoll killed once, the power cut once, a disk lost once.
SPECIFICATION Spec
CONSTANTS
    NFolders = 2
    NNames = 2
    NFiles = 2
    StartPath <- TwoPath
    StartOn <- TwoOn
    StartDirs <- DirsD
    ExDisks = {1, 2}
    MaxUser = 2
    MaxCrash = 1
    MaxCut = 1
    MaxDrop = 1
    MaxOps = 4
    UserActs = {"mv"}
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv4_UnknownNeverAbsent
    Inv7_RenameDurable
    NamesKept
    RenamesAreUsers
    OneRowAnObject
CHECK_DEADLOCK FALSE
