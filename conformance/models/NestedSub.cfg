\* expect: pass
\* module: MCNested.tla
\* D and D/E on both disks, a file in each: a user acting twice, on either disk, a folder moved with its
\* subtree or its subfolder alone; Atoll killed once, a disk lost once.
SPECIFICATION Spec
CONSTANTS
    NNames = 2
    NFiles = 2
    StartDirs <- DirsNested
    StartFile <- FilesNested
    StartOn <- OnNested
    Refuse <- RefuseNone
    UserActs = {"mvdir", "mkdir", "mv"}
    UserDisks = {1, 2}
    MaxUser = 2
    MaxCrash = 1
    MaxDrop = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    LastCopyKept
    RenamesAreUsers
    OneRowAnObject
CHECK_DEADLOCK FALSE
