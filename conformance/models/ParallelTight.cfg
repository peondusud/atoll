\* expect: pass
\* module: MCCopies.tla
\* Copies at once on an SSD with room for one past min_free (§13.4): two files, each on a disk with a spindle, both
\* wanting a replica that only the SSD can take: the plan queues one, holding its room, and the other waits. Atoll killed
\* once, a disk lost once.
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    NFiles = 2
    Size <- SizeOne
    Cap <- CapTwo
    MinFree <- MinFreeOne
    Limit <- LimitSSD
    Total = 8
    Level = 2
    Start <- StartApart
    MaxUser = 0
    FillBy = 1
    MaxView = 0
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 4
    Fixes = {}
INVARIANTS
    TypeOK
    MinFreeKept
    CapacityKept
    OneCopyOfAFile
    LimitsKept
    Inv1_CopiesHold
    Inv7_PipelineOrder
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
CHECK_DEADLOCK FALSE
