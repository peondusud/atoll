\* expect: pass
\* module: MCRebuild.tla
\* Two disks in sync, an entry in disk 2's trash: a user editing or deleting a copy directly, twice in all; a disk
\* lost or mounted read-only, or an entry's retention passing, twice in all; a rebuild among the passes; Atoll killed
\* once, a rebuild's step or an operation's.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    Cache = FALSE
    AtStart = {1, 2}
    TrashAt = {2}
    UserActs = {"edit", "delete"}
    UserDisks = {1, 2}
    MaxUser = 2
    WorldActs = {"lose", "readonly", "tick"}
    WorldDisks = {1, 2}
    MaxWorld = 2
    AtollActs = {"rebuild", "kill"}
    MaxKill = 1
    MaxRebuild = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    RebuiltConflict
    MissingNotEmpty
    PartsKept
    OldKept
CHECK_DEADLOCK FALSE
