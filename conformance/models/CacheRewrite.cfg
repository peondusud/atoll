\* expect: pass
\* The SSD cache's transfer and the limit of flaw 1 (§14.2, §19): a file on the cache disk 1 alone leaves it for the
\* data disk 2, and a user rewrites a copy keeping its size and dates, which moves only its change time, with Atoll
\* killed or the disk lost after the rename of the copy on disk 2: that copy, recorded unverified, holds the transfer
\* back until a read takes it again, and the copy on the cache stays.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 1
    Phys <- PhysTwo
    Start <- StartOne
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 4
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {"rewrite"}
    ViewActs = {}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 0
    CacheDisks = {1}
    Guard = "none"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv2_LastUserCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
CHECK_DEADLOCK FALSE
