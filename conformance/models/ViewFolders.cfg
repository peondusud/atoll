\* expect: pass
\* module: MCViewNames.tla
\* D/x on both disks and D/y on disk 2 alone: the view renames a file, replaces one, and renames the folder D on
\* every disk that holds it, twice at most; atoll mount stopped once, a disk lost once.
SPECIFICATION Spec
CONSTANTS
    NFolders = 2
    NNames = 2
    NFiles = 2
    StartPath <- AlonePath
    StartOn <- AloneOn
    StartDirs <- DirsD
    Direct = "propagate"
    ViewActs = {"rename", "replace", "mvdir"}
    MaxView = 2
    UserActs = {}
    MaxUser = 0
    MaxStop = 1
    MaxDrop = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
CHECK_DEADLOCK FALSE
