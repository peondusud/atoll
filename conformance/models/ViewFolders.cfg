\* expect: pass
\* module: MCViewNames.tla
\* D/x on both disks and D/y on disk 2 alone: the view renames a file, replaces one, and renames the folder D on
\* every disk that holds it, twice at most; atoll mount stopped once, a disk lost once. It takes the remedies proposed for flaws 18 to 22, still open, so that it looks past them (README.md).
SPECIFICATION Spec
CONSTANTS
    NFolders = 2
    NNames = 2
    NFiles = 2
    StartPath <- AlonePath
    StartOn <- AloneOn
    StartDirs <- DirsD
    Direct = "propagate"
    ViewActs = {"rename", "replace", "mvdir"}
    MaxView = 2
    UserActs = {}
    MaxUser = 0
    MaxStop = 1
    MaxDrop = 1
    Fixes = {"replace-gone", "folder-key", "view-moot", "job-view-held"}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
CHECK_DEADLOCK FALSE
