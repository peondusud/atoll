\* expect: pass
\* module: MCCopies.tla
\* Copies at once of one file to several disks, with refreshes (§14, §14.1, §15.4): one file at three copies on three
\* SSDs, each taking two copies at once; a user writes into a copy in place, twice, at any moment: the pass makes the
\* other two stale, sends each to the trash, and refreshes both from the copy that changed, which the per-path lock
\* runs one at a time; a second write may land while a refresh reads its source. Atoll killed once, a disk lost and
\* mounted again once.
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    NFiles = 1
    Size <- SizeUnit
    Cap <- CapRoom
    MinFree <- MinFreeOne
    Limit <- LimitFlash
    Total = 8
    Level = 3
    Start <- StartAll
    MaxUser = 0
    FillBy = 1
    MaxView = 0
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 5
    MaxEdit = 2
    Fixes = {}
INVARIANTS
    TypeOK
    MinFreeKept
    CapacityKept
    OneCopyOfAFile
    LimitsKept
    Inv1_CopiesHold
    Inv7_PipelineOrder
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    LatestKept
    ReplicaInSync
CHECK_DEADLOCK FALSE
