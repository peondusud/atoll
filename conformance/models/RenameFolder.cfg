\* expect: pass
\* module: MCRename.tla
\* A file at A/x on two disks, renamed by a user on one of them into a folder B made for it, private or open; the
\* pass takes the rename to the other disk, which lacks B: B made there with the mode of its model, then the
\* rename. Atoll killed once and a disk lost once, between any two steps.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    Start <- StartBoth
    StartB <- BNone
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 3
    UserActs = {"rename"}
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv4_UnknownNeverAbsent
    Inv7_RenameDurable
    Inv12_JournalFirst
    FolderNeverOpened
    UserFolderKept
    OneRowAnObject
    NamesKept
    RenamesAreUsers
CHECK_DEADLOCK FALSE
