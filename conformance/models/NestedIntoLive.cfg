\* expect: pass
\* module: MCNested.tla
\* Liveness: NestedInto, the user on disk 1 alone, as acts on two disks can conflict for good (a
\* file path-taken, every version kept).
SPECIFICATION FairSpec
CONSTANTS
    NNames = 2
    NFiles = 2
    StartDirs <- DirsDE
    StartFile <- FileD
    StartOn <- OnD
    Refuse <- RefuseNone
    UserActs = {"mvdir", "mkdir", "mv"}
    UserDisks = {1}
    MaxUser = 2
    MaxCrash = 1
    MaxDrop = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    LastCopyKept
    RenamesAreUsers
    OneRowAnObject
PROPERTIES
    EventuallyFollowed
CHECK_DEADLOCK FALSE
