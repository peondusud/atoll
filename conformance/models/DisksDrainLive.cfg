\* expect: pass
\* module: MCDisks.tla
\* Liveness: disk 1 replaced by the spare, drained, then taken out; a user editing the file on disk 1 once.
SPECIFICATION LiveSpec
CONSTANTS
    NDisks = 2
    Spare = TRUE
    SpareClone = FALSE
    SpareShares = FALSE
    Level = 1
    Holders = {1, 2}
    Fuse = FALSE
    Remount = FALSE
    UserActs = {"edit"}
    UserDisks = {1}
    MaxUser = 1
    WorldActs = {}
    WorldDisks = {}
    MaxWorld = 0
    AtollActs = {"pass", "grace"}
    MaxKill = 0
    CmdActs = {"replace", "remove"}
    CmdDisks = {1}
    MaxCmd = 2
    Fixes = {"remove-looks"}
INVARIANTS
    TypeOK
PROPERTIES
    EventuallySettled
CHECK_DEADLOCK FALSE
