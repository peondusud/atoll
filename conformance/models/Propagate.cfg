\* expect: pass
\* A file at its level, on two disks of three: two actions of a user (modify, replace, delete, create, on any disk,
\* at any moment), so a deletion, an atomic save or a modification is propagated while Atoll is killed once and a
\* disk is lost and mounted again once.
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    NFiles = 1
    Level = 2
    Phys <- PhysShared
    Start <- StartTwo
    LinkDisks = {}
    MaxUser = 2
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 4
    Waits = TRUE
    Grace = TRUE
    Fixes = {}
    UserActs = {"modify", "replace", "delete", "create"}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
CHECK_DEADLOCK FALSE
