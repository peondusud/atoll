\* expect: pass
\* module: MCFolders.tla
\* D/x and E/x on two disks; a user swaps the names of the folders D and E on one disk, which no walk reads as a folder
\* renamed, as each name still holds a row (§15.12): the files move one by one, each at the other's name, by an
\* exchange across the two folders; and one more change by a user on either disk at any moment. Atoll killed once, a
\* disk lost once. It takes exchange-back, the remedy proposed for flaw 13, still open, to look past it.
SPECIFICATION Spec
CONSTANTS
    NFolders = 2
    NNames = 1
    NFiles = 2
    StartPath <- CrossPath
    StartOn <- CrossOn
    StartDirs <- DirsDE
    ExDisks = {1, 2}
    MaxUser = 2
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 3
    UserActs = {"swapdir", "delete", "replace", "rmdir"}
    Fixes = {"exchange-back"}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv4_UnknownNeverAbsent
    Inv7_RenameDurable
    NamesKept
    RenamesAreUsers
    OneRowAnObject
CHECK_DEADLOCK FALSE
