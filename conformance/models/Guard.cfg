\* expect: pass
\* The link guard (§17): a file at its level on disks 1 and 2, each copy given its link at the end of a pass; two user
\* actions on either disk at any moment, deletions and atomic saves, as through mergerfs one branch at a time, so that a
\* link holds the data a deletion or a replacement around Atoll left: the link sent to the trash from the link, removed
\* once its data has another name, Atoll killed once.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartTwo
    LinkDisks = {}
    MaxUser = 2
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 6
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {"replace", "delete"}
    ViewActs = {}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 0
    CacheDisks = {}
    Guard = "on"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
CHECK_DEADLOCK FALSE
