\* expect: pass
\* module: MCCollisions.tla
\* Films/a on S, Other/a on S and N, a third file the view may make, file names a and b: a user
\* renaming a file or a folder on S, writing a new file through the view, making a folder on N,
\* four times; N finds names by their bytes.
SPECIFICATION Spec
CONSTANTS
    NFolders = 3
    NNames = 2
    SameNames = FALSE
    Fold = FALSE
    NFiles = 3
    StartPath <- PathsView
    StartN <- OnOther
    Acts = {"mv", "mvdir", "view", "mkdir"}
    MaxActs = 4
    Fixes = {}
INVARIANTS
    TypeOK
    NoAtollPair
    WritesNoCollision
    CopiesAtTheirNames
CHECK_DEADLOCK FALSE
