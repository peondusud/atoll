\* expect: NoAtollPair
\* module: MCCollisions.tla
\* Flaw 24, open: Films/a on S, Other/a on S and N; the plan places Films/a on N, its folder held by the plan
\* alone; a user renames Other/a to films/a on S, which the pass takes to N, films made there by what the catalog
\* says; then the copy makes Films beside it.
SPECIFICATION Spec
CONSTANTS
    NFolders = 3
    NNames = 2
    SameNames = FALSE
    Fold = FALSE
    NFiles = 2
    StartPath <- PathsTwo
    StartN <- OnOther
    Acts = {"mv"}
    MaxActs = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoAtollPair
    WritesNoCollision
    CopiesAtTheirNames
CHECK_DEADLOCK FALSE
