\* expect: pass
\* module: MCCollisions.tla
\* Flaw 24, fixed on 2026-11-25 (disk-key-look): Films/a on S, Other/a on S and N; the plan places Films/a on N, its
\* folder held by the plan alone; a user renames Other/a to films/b on S, which the pass takes to N, films made
\* there by what the catalog says; then the copy, its look at N's root listing films, is refused.
SPECIFICATION Spec
CONSTANTS
    NFolders = 3
    NNames = 2
    SameNames = FALSE
    Fold = FALSE
    NFiles = 2
    StartPath <- PathsTwo
    StartN <- OnOther
    Acts = {"mv"}
    MaxActs = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoAtollPair
    WritesNoCollision
    CopiesAtTheirNames
CHECK_DEADLOCK FALSE
