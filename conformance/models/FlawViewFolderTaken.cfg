\* expect: liveness
\* module: MCViewNames.tla
\* Flaw 21, open: a user makes E directly on one disk, which no pass has recorded; the view renames D to E, refused
\* there, made on the other: the job can never run there, the old folder stays, and the rename is never taken in
\* (README.md). With view-moot in Fixes, it passes.
SPECIFICATION FairSpec
CONSTANTS
    NFolders = 2
    NNames = 1
    NFiles = 1
    StartPath <- OnePath
    StartOn <- OneOn
    StartDirs <- DirsD
    Direct = "propagate"
    ViewActs = {"mvdir"}
    MaxView = 1
    UserActs = {"mkdir"}
    MaxUser = 1
    MaxStop = 0
    MaxDrop = 0
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
PROPERTIES
    EventuallySettled
CHECK_DEADLOCK FALSE
