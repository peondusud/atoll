\* expect: RenamesAreUsers
\* module: MCFolders.tla
\* Flaw 16, open: a folder D on two disks, D/x on both and D/y on disk 2 alone; a user renames D to E on one disk and
\* back, the job D to E on the other disk stopped once its rename went through: a rename back decided while that disk
\* is away clears its rows and drops the job, its reprise then finishes the rename, and D/y, which only that disk holds,
\* is read as renamed to E/y by the user (README.md). With folder-wait in Fixes, it passes.
SPECIFICATION Spec
CONSTANTS
    NFolders = 2
    NNames = 2
    NFiles = 3
    StartPath <- JobPath
    StartOn <- JobOn
    StartDirs <- DirsD
    ExDisks = {1, 2}
    MaxUser = 2
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 3
    UserActs = {"mvdir"}
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv4_UnknownNeverAbsent
    Inv7_RenameDurable
    NamesKept
    RenamesAreUsers
    OneRowAnObject
CHECK_DEADLOCK FALSE
