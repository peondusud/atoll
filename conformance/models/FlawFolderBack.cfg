\* expect: pass
\* module: MCFolders.tla
\* Flaw 16 (README.md), fixed: a folder D on two disks, D/x on both and D/y on disk 2 alone; a user renames D to E on
\* one disk and back, the job D to E on the other disk stopped once its rename went through. The files below the
\* folder's operation left planned decide nothing until that disk's reprise (folder-wait, the maintainer's remedy,
\* 2026-11-23). Until that remedy, a rename back decided while that disk was away cleared its rows and dropped the
\* job, its reprise then finished the rename, and D/y, which only that disk holds, was read as renamed to E/y by the
\* user.
SPECIFICATION Spec
CONSTANTS
    NFolders = 2
    NNames = 2
    NFiles = 3
    StartPath <- JobPath
    StartOn <- JobOn
    StartDirs <- DirsD
    ExDisks = {1, 2}
    MaxUser = 2
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 3
    UserActs = {"mvdir"}
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv4_UnknownNeverAbsent
    Inv7_RenameDurable
    NamesKept
    RenamesAreUsers
    OneRowAnObject
CHECK_DEADLOCK FALSE
