\* expect: pass
\* A replica made of one file on three disks, two of them on one physical disk (R-06): Atoll killed once, the
\* power cut once, a disk lost and mounted again once, and a user acting once, on any disk, at any moment.
\* With the remedy proposed for flaw 2 (README.md).
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    NFiles = 1
    Level = 2
    Phys <- PhysShared
    Start <- StartOne
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 1
    MaxDrop = 1
    MaxOps = 4
    Waits = TRUE
    Grace = TRUE
    Fixes = {"running-job"}
    UserActs = {"modify", "replace", "delete", "create"}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
CHECK_DEADLOCK FALSE
