\* expect: pass
\* A file at its level on two disks, written and deleted through Atoll's own view (§21.2): the write journaled once on
\* the copy the view presents, the deletion of that copy to the trash at once, step by step, then the daemon's passes
\* taking the deletion to the other copy, the modification to it, and each operation of the view in. atoll mount
\* stopped short once.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartTwo
    LinkDisks = {}
    MaxUser = 2
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 3
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {}
    ViewActs = {"write", "delete"}
    Parallel = FALSE
    MaxStop = 1
    MaxVOps = 2
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
    ViewPresentsLatest
CHECK_DEADLOCK FALSE
