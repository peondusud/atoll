\* expect: pass
\* Flaw 11 (README.md), fixed: a file replicated from disk 1 to disk 2; the guard journals the link of the copy on
\* disk 2, a user rewrites that copy keeping its size and dates, the link is made and Atoll is killed before its
\* commit. The reprise leaves the copy's row as it recorded it (link-keep, §17.2), and the next look reads the write
\* by its change time; until that remedy, the reprise took the change time it found, the write's.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartOne
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 6
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {"rewrite"}
    ViewActs = {}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 0
    CacheDisks = {}
    Guard = "on"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
CHECK_DEADLOCK FALSE
