\* expect: ReplicaInSync
\* Flaw 11 (README.md): the reprise of an operation link of the link guard gives the copy's row the change time it
\* finds (§17.2). A file replicated from disk 1 to disk 2; the guard journals the link of the copy on disk 2, a user
\* rewrites that copy keeping its size and dates, the link is made and Atoll is killed before its commit: the reprise
\* takes the change time the write moved for the link's, and the row says the copy holds the version it was made from.
\* The remedies are named in Fixes: link-keep, link-doubt.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartOne
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 6
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {"rewrite"}
    ViewActs = {}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 0
    CacheDisks = {}
    Guard = "on"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
CHECK_DEADLOCK FALSE
