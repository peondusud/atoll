    Coarse = {}
    Unverified = {}
    Mode = "chunk"
    UserActs = {"edit"}
    UserDisks = {1}
    MaxUser = 1
    WorldActs = {"sector", "rot", "flip", "lose"}
    WorldDisks = {1, 2}
    MaxWorld = 2
    AtollActs = {"scrub", "kill"}
    MaxKill = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoEditCalledCorrupt
    NoEditRepairedAway
    TrashFirst
    SourceVerified
    NoWrongVerify
    LastKept
    SoundNeverCorrupt
    NoUserTakenForTorn
