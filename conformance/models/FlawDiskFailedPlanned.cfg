    Fuse = FALSE
    Remount = FALSE
    UserActs = {}
    UserDisks = {}
    MaxUser = 0
    WorldActs = {"unplug"}
    WorldDisks = {2}
    MaxWorld = 1
    AtollActs = {"pass"}
    MaxKill = 0
    CmdActs = {"fail", "remove"}
    CmdDisks = {2}
    MaxCmd = 2
    Fixes = {}
INVARIANTS
    TypeOK
PROPERTIES
    FailedLeaves
CHECK_DEADLOCK FALSE
