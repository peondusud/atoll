\* expect: liveness
\* module: MCDisks.tla
\* Flaw 30: a file replicated from disk 1 to disk 2, disk 2 unplugged once while its copy is planned, then
\* declared failed: what is planned there stays, and disk remove refuses it for good.
SPECIFICATION LiveSpec
CONSTANTS
    NDisks = 2
    Spare = FALSE
    SpareClone = FALSE
    SpareShares = FALSE
    Level = 1
    Holders = {1}
    Fuse = FALSE
    Remount = FALSE
    UserActs = {}
    UserDisks = {}
    MaxUser = 0
    WorldActs = {"unplug"}
    WorldDisks = {2}
    MaxWorld = 1
    AtollActs = {"pass"}
    MaxKill = 0
    CmdActs = {"fail"}
    CmdDisks = {2}
    MaxCmd = 1
    Fixes = {}
INVARIANTS
    TypeOK
PROPERTIES
    FailedLeaves
CHECK_DEADLOCK FALSE
