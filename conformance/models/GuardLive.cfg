\* expect: pass
\* Liveness with the link guard turned off: a file at its level on disks 1 and 2, a user deleting it once on either disk,
\* Atoll killed once, the guard turned off once at any moment: every link goes at last (EventuallyUnlinked), and the file
\* settles with no operation left planned (EventuallySettled). No decision waits here (Waits), and there are op ids
\* enough. The remedy of flaw 11 in Fixes (README.md).
SPECIFICATION FairSpec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartTwo
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 10
    Waits = FALSE
    Grace = FALSE
    Fixes = {"link-keep"}
    UserActs = {"delete"}
    ViewActs = {}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 0
    CacheDisks = {}
    Guard = "off"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv7_PipelineOrder
    Inv12_JournalFirst
    ReplicaInSync
PROPERTY
    EventuallyUnlinked
    EventuallySettled
CHECK_DEADLOCK FALSE
