\* expect: ReplicaInSync
\* Flaw 1 (README.md), specs.md as it is: a user writes into a replica once its name is in the library and before
\* its row is written (§14.2: "with what a look at its new name finds"); the row records that write as a verified
\* copy of the version the replica was made from, and no look ever sees the edit. A crash at source-synced makes the
\* window as long as Atoll is down (conformance/models/flaws/replica-edited-before-commit.json).
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartOne
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 3
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {"modify"}
INVARIANTS
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    ReplicaInSync
CHECK_DEADLOCK FALSE
