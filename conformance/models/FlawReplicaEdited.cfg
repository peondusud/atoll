\* expect: pass
\* Flaw 1 (README.md), fixed: a user writes into a replica once its name is in the library and before its row is
\* written, or while Atoll is down after a crash at source-synced. The row takes what the part was when it was
\* verified (§14.2), so the next look reads the write as an edit; until that remedy, the row recorded the write as a
\* verified copy of the version the replica was made from, and no look ever saw it
\* (conformance/scenarios/replica-edited-before-commit.json).
