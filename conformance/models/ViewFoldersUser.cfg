\* expect: pass
\* module: MCViewNames.tla
\* ViewFolders' pool, the view renaming or removing folders alone, twice at most, and a user acting once directly
\* on either disk (a folder made, renamed or removed, a file moved or deleted); atoll mount stopped once.
\* It takes the remedies proposed for flaws 18 to 22, still open, so that it looks past them (README.md).
SPECIFICATION Spec
CONSTANTS
    NFolders = 2
    NNames = 2
    NFiles = 2
    StartPath <- AlonePath
    StartOn <- AloneOn
    StartDirs <- DirsD
    Direct = "propagate"
    ViewActs = {"mvdir", "rmdir"}
    MaxView = 2
    UserActs = {"mkdir", "mvdir", "rmdir", "mv", "delete"}
    MaxUser = 1
    MaxStop = 1
    MaxDrop = 0
    Fixes = {"replace-gone", "folder-key", "view-moot", "job-view-held"}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
CHECK_DEADLOCK FALSE
