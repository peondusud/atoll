\* expect: pass
\* module: MCFolders.tla
\* D/x and D/y on two disks; a user swaps their names on one disk, and makes one more change on either at any moment
\* (a swap, a deletion, an atomic save, a new file): the pass renames both copies of the other disk, each path-taken
\* at the other's name, by an exchange. Atoll killed once, the power cut once, a disk lost once. It takes exchange-back,
\* the remedy proposed for flaw 13, still open, so that it looks past it (README.md).
SPECIFICATION Spec
CONSTANTS
    NFolders = 1
    NNames = 2
    NFiles = 2
    StartPath <- TwoPath
    StartOn <- TwoOn
    StartDirs <- DirsD
    ExDisks = {1, 2}
    MaxUser = 2
    MaxCrash = 1
    MaxCut = 1
    MaxDrop = 1
    MaxOps = 3
    UserActs = {"swap", "delete", "replace", "create"}
    Fixes = {"exchange-back"}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv4_UnknownNeverAbsent
    Inv7_RenameDurable
    NamesKept
    RenamesAreUsers
    OneRowAnObject
CHECK_DEADLOCK FALSE
