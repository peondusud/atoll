\* expect: pass
\* module: MCViewNames.tla
\* Liveness: D/x on both disks, the folder renamed through the view, a user making or renaming a folder directly
\* once, atoll mount stopped once: every operation resolved and taken in.
SPECIFICATION FairSpec
CONSTANTS
    NFolders = 2
    NNames = 1
    NFiles = 1
    StartPath <- OnePath
    StartOn <- OneOn
    StartDirs <- DirsD
    Direct = "propagate"
    ViewActs = {"mvdir"}
    MaxView = 1
    UserActs = {"mkdir", "mvdir"}
    MaxUser = 1
    MaxStop = 1
    MaxDrop = 0
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
    ViewNamesSettled
PROPERTIES
    EventuallySettled
CHECK_DEADLOCK FALSE
