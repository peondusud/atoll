\* expect: pass
\* module: MCViewNames.tla
\* Liveness: D/x on both disks, the folder renamed through the view, a user making or renaming a folder directly
\* once, atoll mount stopped once: every operation resolved and taken in. It takes the remedies proposed for flaws 18 to 22, still open, so that it looks past them (README.md).
SPECIFICATION FairSpec
CONSTANTS
    NFolders = 2
    NNames = 1
    NFiles = 1
    StartPath <- OnePath
    StartOn <- OneOn
    StartDirs <- DirsD
    Direct = "propagate"
    ViewActs = {"mvdir"}
    MaxView = 1
    UserActs = {"mkdir", "mvdir"}
    MaxUser = 1
    MaxStop = 1
    MaxDrop = 0
    Fixes = {"replace-gone", "folder-key", "view-moot", "job-view-held"}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
PROPERTIES
    EventuallySettled
CHECK_DEADLOCK FALSE
