\* expect: NoOverwriteRefused
\* module: MCGuards.tla
\* Flaw 27, open: two files rewritten on D; the second trips the guard, rejected; the daemon stops in the pass after,
\* and the next starts past the window: the reject lapsed, the change counts as any other, and overwrites E's copy.
SPECIFICATION Spec
CONSTANTS
    NFiles = 2
    DelFiles = 9
    DelWin = 2
    ModFiles = 1
    ModWin = 1
    DayFiles = 1
    DayWin = 3
    UserActs = {"mod"}
    MaxUser = 3
    MaxTime = 5
    AnswerActs = {"mreject"}
    Fixes = {}
INVARIANTS
    TypeOK
    DelBounded
    ModBounded
    DayBounded
    NoTrashHeld
    NoTrashRefused
    NoOverwriteHeld
    NoOverwriteRefused
CHECK_DEADLOCK FALSE
