\* expect: pass
\* A new file through Atoll's own view, written in parallel to its replica's target, then closed with no write
\* (§21.2), while the daemon's passes record it, adopt the part or drop it, finish the replica and take the view's
\* operations in, with the daemon killed once and a disk lost once, either of them at any step.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartNone
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 3
    Waits = TRUE
    Grace = FALSE
    Fixes = {"view-reprise", "view-resolve", "view-recheck"}
    UserActs = {}
    ViewActs = {"create"}
    Parallel = TRUE
    MaxStop = 0
    MaxVOps = 2
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
    ViewPresentsLatest
CHECK_DEADLOCK FALSE
