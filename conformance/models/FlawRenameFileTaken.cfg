\* expect: pass
\* module: MCRename.tla
\* Flaw 7 (README.md), fixed: a rename taken to the other copy, and a program saving a new file at the copy's old name
\* between the look right before the move and the move: rename(2) moves that file to the new name, and the look after
\* puts it back at the old name at once (ops.putBack); it once stayed at the new name.
