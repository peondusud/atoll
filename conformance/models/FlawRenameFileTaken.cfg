    StartB <- BNone
    LinkDisks = {}
    MaxUser = 2
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 4
    UserActs = {"rename", "replace"}
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv4_UnknownNeverAbsent
    Inv7_RenameDurable
    Inv12_JournalFirst
    FolderNeverOpened
    UserFolderKept
    OneRowAnObject
    NamesKept
    RenamesAreUsers
CHECK_DEADLOCK FALSE
