\* expect: NamesKept
\* module: MCRename.tla
\* Flaw 7 (README.md), open: a rename taken to the other copy, and a program saving a new file at the copy's old name
\* between the look right before the move and the move: rename(2) moves that file to the new name, the look after
\* finds it is not the copy, and the operation is undone with the file left there (§17.2: for a rename, what the
\* target holds stays). Fixes = {"mkdir-key", "rename-back"}, the file put back at the name it took, passes.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    Start <- StartBoth
    StartB <- BNone
    LinkDisks = {}
    MaxUser = 2
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 4
    UserActs = {"rename", "replace"}
    Fixes = {"mkdir-key"}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv4_UnknownNeverAbsent
    Inv7_RenameDurable
    Inv12_JournalFirst
    FolderNeverOpened
    UserFolderKept
    OneRowAnObject
    NamesKept
    RenamesAreUsers
CHECK_DEADLOCK FALSE
