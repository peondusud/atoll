\* expect: pass
\* A new file through Atoll's own view, written in parallel to its replica's target, written once, closed, and
\* deleted through the view, while it is written or once it is closed (§21.2): the part dropped with the file being
\* written, or handed over and then left with no file, while the daemon's passes go on. atoll mount stopped once.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartNone
    LinkDisks = {}
    MaxUser = 3
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 3
    Waits = TRUE
    Grace = FALSE
    Fixes = {"view-reprise", "view-resolve", "view-recheck"}
    UserActs = {}
    ViewActs = {"create", "delete"}
    Parallel = TRUE
    MaxStop = 1
    MaxVOps = 3
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
    ViewPresentsLatest
CHECK_DEADLOCK FALSE
