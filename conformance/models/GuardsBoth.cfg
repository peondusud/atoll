\* expect: pass
\* module: MCGuards.tla
\* Both guards at once: two files, a user deleting, putting back, rewriting on D, editing on E, or the
\* daemon stopping, three times in all; every answer.
SPECIFICATION Spec
CONSTANTS
    NFiles = 2
    DelFiles = 1
    DelWin = 2
    ModFiles = 1
    ModWin = 1
    DayFiles = 9
    DayWin = 3
    UserActs = {"del", "back", "mod", "edit"}
    MaxUser = 3
    MaxTime = 4
    AnswerActs = {"dconfirm", "dreject", "mconfirm", "mreject"}
    Fixes = {}
INVARIANTS
    TypeOK
    DelBounded
    ModBounded
    DayBounded
    NoTrashHeld
    NoTrashRefused
    NoOverwriteHeld
    NoOverwriteRefused
CHECK_DEADLOCK FALSE
