\* expect: pass
\* Liveness with the SSD cache: Atoll's passes run fairly, and a disk lost is mounted again in time. A file on the cache
\* disk 1 alone, through a user acting once, Atoll killed once and a disk lost once, eventually leaves it: its copy on
\* the data disk 2 at its level, none on the cache, and no operation left planned (EventuallySettled). No decision waits
\* here (Waits), and there are op ids enough.
SPECIFICATION FairSpec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 1
    Phys <- PhysTwo
    Start <- StartOne
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 8
    Waits = FALSE
    Grace = FALSE
    Fixes = {}
    UserActs = {"modify", "replace", "delete", "create"}
    ViewActs = {}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 0
    CacheDisks = {1}
    Guard = "none"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv2_LastUserCopyKept
    Inv7_PipelineOrder
    Inv12_JournalFirst
    ReplicaInSync
    DoubtUnverified
PROPERTY
    EventuallySettled
CHECK_DEADLOCK FALSE
