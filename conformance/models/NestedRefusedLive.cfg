\* expect: pass
\* module: MCNested.tla
\* Liveness: NestedRefused, the user on disk 1 alone: every copy follows, but one whose name its disk
\* refuses, behind or in the trash.
SPECIFICATION FairSpec
CONSTANTS
    NNames = 2
    NFiles = 2
    StartDirs <- DirsD
    StartFile <- FileD
    StartOn <- OnD
    Refuse <- RefuseE2
    UserActs = {"mvdir", "mkdir", "mv"}
    UserDisks = {1}
    MaxUser = 3
    MaxCrash = 1
    MaxDrop = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    LastCopyKept
    RenamesAreUsers
    OneRowAnObject
PROPERTIES
    EventuallyFollowed
CHECK_DEADLOCK FALSE
