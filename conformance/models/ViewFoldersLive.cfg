\* expect: pass
\* module: MCViewNames.tla
\* Liveness: the folder renamed or removed on every disk, atoll mount stopped once, a disk lost once and mounted
\* again in time: every operation resolved and taken in. It takes the remedies proposed for flaws 18 to 22, still open, so that it looks past them (README.md).
SPECIFICATION FairSpec
CONSTANTS
    NFolders = 2
    NNames = 2
    NFiles = 2
    StartPath <- AlonePath
    StartOn <- AloneOn
    StartDirs <- DirsD
    Direct = "propagate"
    ViewActs = {"mvdir", "rmdir"}
    MaxView = 1
    UserActs = {}
    MaxUser = 0
    MaxStop = 1
    MaxDrop = 1
    Fixes = {"replace-gone", "folder-key", "view-moot", "job-view-held"}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
PROPERTIES
    EventuallySettled
CHECK_DEADLOCK FALSE
