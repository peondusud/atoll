\* expect: pass
\* module: MCViewNames.tla
\* Liveness: the folder renamed or removed on every disk, atoll mount stopped once, a disk lost once and mounted
\* again in time: every operation resolved and taken in.
SPECIFICATION FairSpec
CONSTANTS
    NFolders = 2
    NNames = 2
    NFiles = 2
    StartPath <- AlonePath
    StartOn <- AloneOn
    StartDirs <- DirsD
    Direct = "propagate"
    ViewActs = {"mvdir", "rmdir"}
    MaxView = 1
    UserActs = {}
    MaxUser = 0
    MaxStop = 1
    MaxDrop = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
    ViewNamesSettled
PROPERTIES
    EventuallySettled
CHECK_DEADLOCK FALSE
