\* expect: pass
\* module: MCFolders.tla
\* Liveness: D/x and D/y on two disks, swapped by a user on one disk; Atoll killed once, a disk lost once and mounted
\* again in time: the exchange gets both copies of the other disk to their names, and nothing stays planned. It takes
\* exchange-back, the remedy proposed for flaw 13, still open.
SPECIFICATION FairSpec
CONSTANTS
    NFolders = 1
    NNames = 2
    NFiles = 2
    StartPath <- TwoPath
    StartOn <- TwoOn
    StartDirs <- DirsD
    ExDisks = {1, 2}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 6
    UserActs = {"swap"}
    Fixes = {"exchange-back"}
INVARIANTS
    TypeOK
    NoUserDataLost
    NamesKept
    RenamesAreUsers
PROPERTIES
    EventuallyFollowed
CHECK_DEADLOCK FALSE
