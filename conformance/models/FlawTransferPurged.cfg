\* expect: NoUserDataLost
\* Flaw 8 (README.md): the SSD cache's transfer leans on the catalog alone for the copy on the data disk. A file on the
\* cache disk 1 alone, a user copy, leaves it for the data disk 2; a user deletes the copy on disk 2 directly after the
\* pass's walk, and the transfer then sends the copy on the cache, the file's last, to the trash and purges it there.
\* The remedies are named in Fixes: xfer-look, xfer-keep.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 1
    Phys <- PhysTwo
    Start <- StartOne
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 4
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {"delete"}
    ViewActs = {}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 0
    CacheDisks = {1}
    Guard = "none"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv2_LastUserCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
CHECK_DEADLOCK FALSE
