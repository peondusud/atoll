\* expect: pass
\* Flaw 8 (README.md), fixed: a file on the cache disk 1 alone, a user copy, leaves it for the data disk 2; a user
\* deletes the copy on disk 2 directly after the pass's walk. The transfer looks at the copies on the data disks
\* right before the purge (xfer-look), finds that one gone, and purges nothing: the copy on the cache stays in its
\* trash (§19); until that remedy, it leaned on the catalog alone, and purged the file's last copy there.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 1
    Phys <- PhysTwo
    Start <- StartOne
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 4
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {"delete"}
    ViewActs = {}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 0
    CacheDisks = {1}
    Guard = "none"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv2_LastUserCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
CHECK_DEADLOCK FALSE
