\* expect: NoUserDataLost
\* module: MCRebuild.tla
\* A new file on the SSD cache, a program holding it open through Atoll's own view and writing it, the view maybe
\* stopped and started again; a rebuild: its catalog knows nothing of what the view holds, and the transfer moves
\* the copy and purges it under the program.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    Cache = TRUE
    AtStart = {1}
    TrashAt = {}
    UserActs = {"view"}
    UserDisks = {}
    MaxUser = 3
    WorldActs = {}
    WorldDisks = {}
    MaxWorld = 0
    AtollActs = {"rebuild", "viewstop"}
    MaxKill = 0
    MaxRebuild = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    RebuiltConflict
    MissingNotEmpty
    PartsKept
    OldKept
CHECK_DEADLOCK FALSE
