\* check refuses would (specs.md §10).
SPECIFICATION Spec
CONSTANTS
    NFolders = 3
    NNames = 2
    SameNames = TRUE
    Fold = TRUE
    NFiles = 3
    StartPath <- PathsView
    StartN <- OnOther
    Acts = {"mv", "mvdir", "view", "mkdir"}
    MaxActs = 4
    Fixes = {}
INVARIANTS
    TypeOK
    NoAtollPair
    WritesNoCollision
    CopiesAtTheirNames
CHECK_DEADLOCK FALSE
