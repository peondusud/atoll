\* expect: pass
\* module: MCCollisions.tla
\* Collisions' pool, a and A sharing a key, N finding names by their key, as ntfs3 a pair in
\* two cases. Until flaws 24 and 25 are fixed, it checks only that N never holds two names
\* with one key that Atoll wrote, which such a driver never makes (README.md).
SPECIFICATION Spec
CONSTANTS
    NFolders = 3
    NNames = 2
    SameNames = TRUE
    Fold = TRUE
    NFiles = 3
    StartPath <- PathsView
    StartN <- OnOther
    Acts = {"mv", "mvdir", "view", "mkdir"}
    MaxActs = 4
    Fixes = {}
INVARIANTS
    TypeOK
    NoAtollPair
CHECK_DEADLOCK FALSE
