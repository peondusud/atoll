\* expect: pass
\* module: MCViewMove.tla
\* Flaw 17 (README.md), fixed: the move of a file out of space, a user deleting directly, once, at any moment. The
\* move looks at the target right before it purges the copy left on the full disk, or removes it at its path, and
\* keeps it when the target no longer holds the copy it placed as it placed it (move-look, the maintainer's remedy,
\* 2026-11-23). Until that remedy, one who deleted the copy the move placed on the target, after the handle became
\* its, before the copy left was purged, lost the file, its last content purged from the full disk's trash at once.
SPECIFICATION Spec
CONSTANTS
    MaxUser = 1
    UserActs = {"delete"}
    MaxWrite = 1
    MaxStop = 0
    MaxCut = 0
    MaxDrop = 0
    NoRoom = TRUE
    MaxOps = 3
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv2_MovedFirst
    ViewPresentsLatest
    Inv12_JournalFirst
CHECK_DEADLOCK FALSE
