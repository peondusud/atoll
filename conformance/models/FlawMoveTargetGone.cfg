\* expect: NoUserDataLost
\* module: MCViewMove.tla
\* Flaw 17, open: the move of a file out of space, a user deleting directly, once, at any moment: one who deletes the
\* copy the move placed on the target, after the handle became its, before the copy left on the full disk is purged,
\* loses the file, its last content purged from the full disk's trash at once (README.md). With move-look in Fixes, it
\* passes.
SPECIFICATION Spec
CONSTANTS
    MaxUser = 1
    UserActs = {"delete"}
    MaxWrite = 1
    MaxStop = 0
    MaxCut = 0
    MaxDrop = 0
    NoRoom = TRUE
    MaxOps = 3
    Fixes = {"move-held"}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv2_MovedFirst
    ViewPresentsLatest
    Inv12_JournalFirst
CHECK_DEADLOCK FALSE
