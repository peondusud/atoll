\* expect: pass
\* Propagate.cfg with a power cut in place of the kill -9: whatever a move to the trash or a copy had not synced is
\* gone, a name made durable before the one it replaced went (specs.md §17.1, §20), and the reprise finds both.
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    NFiles = 1
    Level = 2
    Phys <- PhysShared
    Start <- StartTwo
    LinkDisks = {}
    MaxUser = 2
    MaxCrash = 0
    MaxCut = 1
    MaxDrop = 1
    MaxOps = 4
    Waits = TRUE
    Grace = TRUE
    Fixes = {}
    UserActs = {"modify", "replace", "delete", "create"}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
CHECK_DEADLOCK FALSE
