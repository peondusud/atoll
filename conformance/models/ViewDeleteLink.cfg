\* expect: pass
\* ViewDelete on two disks without RENAME_NOREPLACE: the view's deletion is a link, its sync, a look at the source
\* and an unlink, with atoll mount stopped short between any two steps.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartTwo
    LinkDisks = {1, 2}
    MaxUser = 2
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 3
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {}
    ViewActs = {"write", "delete"}
    Parallel = FALSE
    MaxStop = 1
    MaxVOps = 2
    CacheDisks = {}
    Guard = "none"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
    ViewPresentsLatest
CHECK_DEADLOCK FALSE
