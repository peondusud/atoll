\* expect: pass
\* Two files, one to replicate and one at its level, so that one pass works on both and a job, a decision or a crash
\* of one meets the other's: a user acting once, Atoll killed once, a disk lost and mounted again once.
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    NFiles = 2
    Level = 2
    Phys <- PhysShared
    Start <- StartTwoFiles
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 4
    Waits = TRUE
    Grace = TRUE
    Fixes = {}
    UserActs = {"modify", "replace", "delete", "create"}
    ViewActs = {}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 0
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
CHECK_DEADLOCK FALSE
