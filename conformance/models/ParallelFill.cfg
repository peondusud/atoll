\* expect: pass
\* module: MCCopies.tla
\* Copies at once and a user's own file (§12.4, §14): Parallel, with a user writing a file of their own to a disk at any
\* moment, which may take the room past min_free the plan counted on: the copies end no-room, their parts gone, and
\* nothing is written past capacity. Atoll killed once, a disk lost once.
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    NFiles = 2
    Size <- SizeOne
    Cap <- CapThree
    MinFree <- MinFreeOne
    Limit <- LimitSSD
    Total = 8
    Level = 2
    Start <- StartApart
    MaxUser = 1
    FillBy = 1
    MaxView = 0
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 4
    Fixes = {}
INVARIANTS
    TypeOK
    MinFreeKept
    CapacityKept
    OneCopyOfAFile
    LimitsKept
    Inv1_CopiesHold
    Inv7_PipelineOrder
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
CHECK_DEADLOCK FALSE
