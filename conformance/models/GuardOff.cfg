\* expect: pass
\* The link guard turned off (§17, "Turned off"): a file at its level on disks 1 and 2, the guard on at the start and
\* turned off once at any moment; each link then goes, removed when its data has another name, sent to the trash first
\* when it has none, kept while the copy it leads to waits for its decision. Two user actions on either disk, deletions
\* and atomic saves; Atoll killed once. The remedy of flaw 11 in Fixes (README.md).
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartTwo
    LinkDisks = {}
    MaxUser = 2
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 6
    Waits = TRUE
    Grace = FALSE
    Fixes = {"link-keep"}
    UserActs = {"replace", "delete"}
    ViewActs = {}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 0
    CacheDisks = {}
    Guard = "off"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
CHECK_DEADLOCK FALSE
