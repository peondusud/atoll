\* expect: pass
\* module: MCViewMove.tla
\* Liveness: the move of a file whose write ran out of space, atoll mount stopped once, a disk lost once and mounted
\* again in time, a user acting once: no move stays planned, the view's start or its check every 30 s resolving it.
SPECIFICATION FairSpec
CONSTANTS
    MaxUser = 1
    UserActs = {"write", "delete"}
    MaxWrite = 2
    MaxStop = 1
    MaxCut = 0
    MaxDrop = 1
    NoRoom = FALSE
    MaxOps = 3
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv2_MovedFirst
PROPERTIES
    EventuallyResolved
CHECK_DEADLOCK FALSE
