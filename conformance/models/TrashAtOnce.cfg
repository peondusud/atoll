\* expect: pass
\* module: MCTrash.tla
\* The purge at once of the SSD cache's transfer, the view's move, with the link guard: disk 1's copy surplus; a
\* user deleting or editing a copy, unmounting a disk, or Atoll killed, three times in all; the purge for room.
SPECIFICATION Spec
CONSTANTS
    NFiles = 1
    Level = 1
    Guard = TRUE
    UserActs = {"del", "edit", "lose", "stop"}
    MaxUser = 3
    AtollActs = {"pass", "prune", "atonce", "room"}
    MaxTime = 2
    Retention = 2
    NIno = 3
    MaxOps = 6
    Fixes = {}
INVARIANTS
    TypeOK
    NoKeptLost
    RestoreExact
    OneAtATime
    JournaledFirst
    PurgedStaysPurged
CHECK_DEADLOCK FALSE
