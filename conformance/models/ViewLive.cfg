\* expect: pass
\* Liveness with Atoll's own view: a file made through the view and written in parallel, then deleted through it,
\* with atoll mount stopped short once. The daemon's passes, the view's own steps and the program's close run fairly:
\* every operation of the view is taken in at last (EventuallyViewTaken), and the file reaches its level or is gone
\* with no operation left planned (EventuallySettled). No decision waits here (Waits).
SPECIFICATION FairSpec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartNone
    LinkDisks = {}
    MaxUser = 2
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 6
    Waits = FALSE
    Grace = FALSE
    Fixes = {"view-reprise", "view-resolve", "view-recheck"}
    UserActs = {}
    ViewActs = {"create", "delete"}
    Parallel = TRUE
    MaxStop = 1
    MaxVOps = 3
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv7_PipelineOrder
    Inv12_JournalFirst
    ReplicaInSync
    ViewPresentsLatest
PROPERTY
    EventuallyViewTaken
    EventuallySettled
CHECK_DEADLOCK FALSE
