\* expect: pass
\* Liveness with Atoll's own view and a disk lost once, mounted again in time: a file made through the view and
\* written in parallel, the view's mount check resolving what it left planned on
\* a disk back, but for a part it still holds. Every operation of the view is taken in at last, and none stays planned.
SPECIFICATION FairSpec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartNone
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 6
    Waits = FALSE
    Grace = FALSE
    Fixes = {}
    UserActs = {}
    ViewActs = {"create"}
    Parallel = TRUE
    MaxStop = 0
    MaxVOps = 3
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv7_PipelineOrder
    Inv12_JournalFirst
    ReplicaInSync
    ViewPresentsLatest
PROPERTY
    EventuallyViewTaken
    EventuallySettled
CHECK_DEADLOCK FALSE
