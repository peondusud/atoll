\* expect: pass
\* module: MCFolders.tla
\* A folder D on two disks, D/x on both and D/y on disk 2 alone; a user renames D on one of them, and makes one more
\* change of any kind on either disk at any moment: the folder decided, D/y following it, the job run on the other
\* disk as one operation. Atoll killed once and a disk lost once, between any two steps.
SPECIFICATION Spec
CONSTANTS
    NFolders = 2
    NNames = 2
    NFiles = 3
    StartPath <- JobPath
    StartOn <- JobOn
    StartDirs <- DirsD
    ExDisks = {1, 2}
    MaxUser = 2
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 3
    UserActs = {"mvdir", "mv", "create", "delete", "replace", "mkdir", "rmdir"}
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv4_UnknownNeverAbsent
    Inv7_RenameDurable
    NamesKept
    RenamesAreUsers
    OneRowAnObject
CHECK_DEADLOCK FALSE
