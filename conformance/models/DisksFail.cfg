\* expect: pass
\* module: MCDisks.tla
\* disk fail and disk remove with every remedy: a file replicated from disk 1, disk 2 unplugged or dead, a user
\* editing the file on disk 1 or 2, Atoll killed, three times in all; disk 1 or 2 failed, drained or taken out.
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    Spare = FALSE
    SpareClone = FALSE
    SpareShares = FALSE
    Level = 1
    Holders = {1}
    Fuse = FALSE
    Remount = FALSE
    UserActs = {"edit"}
    UserDisks = {1, 2}
    MaxUser = 1
    WorldActs = {"unplug", "die"}
    WorldDisks = {2}
    MaxWorld = 1
    AtollActs = {"pass", "kill"}
    MaxKill = 1
    CmdActs = {"drain", "fail", "remove"}
    CmdDisks = {1, 2}
    MaxCmd = 2
    Fixes = {"remove-looks", "failed-ops-undone", "failed-remove-drops"}
INVARIANTS
    TypeOK
    Inv3_WritesConfirmed
    NoCopyOntoLeaving
    Inv4_UnknownNeverAbsent
    NoLastCopyLost
    OneIdOneDisk
    OnePhysicalDisk
CHECK_DEADLOCK FALSE
