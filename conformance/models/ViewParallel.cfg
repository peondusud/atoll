\* expect: pass
\* Atoll's own view makes a new file and writes it in parallel to its replica's target (§21.2): the create journaled
\* then made, its part journaled then made, the program's write mirrored or the part falling behind, the close, the
\* seal and the hand-over, while the daemon's passes record the file, adopt the part or drop it, finish the replica and
\* take the view's operations in. The program writes once; atoll mount stopped short once.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartNone
    LinkDisks = {}
    MaxUser = 2
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 3
    Waits = TRUE
    Grace = FALSE
    Fixes = {"view-reprise", "view-resolve", "view-recheck"}
    UserActs = {}
    ViewActs = {"create"}
    Parallel = TRUE
    MaxStop = 1
    MaxVOps = 2
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
    ViewPresentsLatest
CHECK_DEADLOCK FALSE
