\* expect: pass
\* module: MCScrub.tla
\* Three disks: a user editing the copy on disk 1 or 2, its modification time moving or not, twice in all; rot,
\* an unreadable sector, a read wrong once or a disk lost on disk 1 or 2, twice in all; the scrub, its budget,
\* its repair by chunk, a pass; Atoll killed once; with repair-recheck.
SPECIFICATION Spec
CONSTANTS
    NDisks = 3
    Coarse = {}
    Unverified = {}
    Mode = "chunk"
    UserActs = {"edit", "keep"}
    UserDisks = {1, 2}
    MaxUser = 2
    WorldActs = {"rot", "sector", "flip", "lose"}
    WorldDisks = {1, 2}
    MaxWorld = 2
    AtollActs = {"scrub", "pass", "budget", "kill"}
    MaxKill = 1
    Fixes = {"repair-recheck"}
INVARIANTS
    TypeOK
    NoEditCalledCorrupt
    NoEditRepairedAway
    TrashFirst
    SourceVerified
    NoWrongVerify
    LastKept
    SoundNeverCorrupt
CHECK_DEADLOCK FALSE
