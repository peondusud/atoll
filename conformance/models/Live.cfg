\* expect: pass
\* Liveness: Atoll's passes run fairly, and a disk lost is mounted again in time. A file below its level, through a
\* user acting once, Atoll killed once and a disk lost once, eventually reaches its level unless in conflict, and no
\* operation stays planned (EventuallySettled). No decision waits here (Waits), and there are op ids enough.
SPECIFICATION FairSpec
CONSTANTS
    NDisks = 3
    NFiles = 1
    Level = 2
    Phys <- PhysShared
    Start <- StartOne
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 6
    Waits = FALSE
    Grace = FALSE
    Fixes = {}
    UserActs = {"modify", "replace", "delete", "create"}
    ViewActs = {}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 0
    CacheDisks = {}
    Guard = "none"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv7_PipelineOrder
    Inv12_JournalFirst
    ReplicaInSync
    DoubtUnverified
PROPERTY
    EventuallySettled
CHECK_DEADLOCK FALSE
