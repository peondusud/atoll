\* expect: UserFolderKept
\* module: MCRename.tla
\* Flaw 6 (README.md), open: an operation mkdir journaled for a rename's missing parent, Atoll killed before the
\* folder is made, and a user making that folder meanwhile, of another mode. The reprise finishes the mkdir on the
\* folder found there and gives it its model's mode (§17.2, ops.recoverMkdir), and records it as Atoll's own, for
\* §17.5 to remove. Fixes = {"mkdir-key"}, the reprise telling its own folder from a user's, passes.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    Start <- StartBoth
    StartB <- BNone
    LinkDisks = {}
    MaxUser = 2
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 4
    UserActs = {"rename", "mkdir"}
    Fixes = {"rename-back"}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv4_UnknownNeverAbsent
    Inv7_RenameDurable
    Inv12_JournalFirst
    FolderNeverOpened
    UserFolderKept
    OneRowAnObject
    NamesKept
    RenamesAreUsers
CHECK_DEADLOCK FALSE
