    NDisks = 3
    NFiles = 2
    Size <- SizeOne
    Cap <- CapThree
    MinFree <- MinFreeOne
    Limit <- LimitSSD
    Total = 8
    Level = 2
    Start <- StartApart
    MaxUser = 0
    FillBy = 1
    MaxView = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 4
    Fixes = {"view-room"}
INVARIANTS
    TypeOK
    MinFreeKept
    CapacityKept
    OneCopyOfAFile
    LimitsKept
    Inv1_CopiesHold
    Inv7_PipelineOrder
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
CHECK_DEADLOCK FALSE
