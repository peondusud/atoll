\* expect: pass
\* module: MCRename.tla
\* Liveness: Atoll's passes run fairly, and a disk lost is mounted again in time. A file renamed by a user on one disk
\* into a folder the other lacks, with Atoll killed once and a disk lost once: its other copy follows at last, the
\* folder made, and no operation stays planned (EventuallyFollowed).
SPECIFICATION FairSpec
CONSTANTS
    NDisks = 2
    Start <- StartBoth
    StartB <- BNone
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 6
    UserActs = {"rename"}
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv7_RenameDurable
    Inv12_JournalFirst
    FolderNeverOpened
    UserFolderKept
    NamesKept
    RenamesAreUsers
PROPERTY
    EventuallyFollowed
CHECK_DEADLOCK FALSE
