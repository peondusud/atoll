    UserActs = {"edit"}
    UserDisks = {1, 3}
    MaxUser = 1
    WorldActs = {"fill", "lose"}
    WorldDisks = {2, 3}
    MaxWorld = 1
    AtollActs = {"balance", "pass", "kill"}
    MaxKill = 1
    Fixes = {}
INVARIANTS
    TypeOK
    Inv13_OnePhysical
    NoBelowLevel
    NoUserCopyMoved
    UserCopiesKept
    EditKept
    NoOnlyVersionMoved
    MinFree
