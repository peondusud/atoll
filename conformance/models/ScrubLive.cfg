\* expect: pass
\* module: MCScrub.tla
\* Liveness: rot or an unreadable sector on disk 1, disk 1 or 2 lost, two times in all; Atoll killed once: the
\* corrupt copy is repaired; with unread-found.
SPECIFICATION LiveSpec
CONSTANTS
    NDisks = 2
    Coarse = {}
    Unverified = {}
    Mode = "chunk"
    UserActs = {}
    UserDisks = {}
    MaxUser = 0
    WorldActs = {"rot", "sector", "lose"}
    WorldDisks = {1, 2}
    MaxWorld = 2
    AtollActs = {"scrub", "kill"}
    MaxKill = 1
    Fixes = {"unread-found"}
INVARIANTS
    TypeOK
PROPERTIES
    EventuallyHealed
CHECK_DEADLOCK FALSE
