\* expect: liveness
\* module: MCViewNames.tla
\* Flaw 18, open: D/x replaced through the view by D/y, deletes.direct at restore: the copy replaced on the other
\* disk is kept and made again onto the name, a conflict, and the view's operation is never taken in (README.md).
\* With replace-gone in Fixes, it passes.
SPECIFICATION FairSpec
CONSTANTS
    NFolders = 1
    NNames = 2
    NFiles = 2
    StartPath <- TwoPath
    StartOn <- TwoOn
    StartDirs <- DirsD
    Direct = "restore"
    ViewActs = {"replace"}
    MaxView = 1
    UserActs = {}
    MaxUser = 0
    MaxStop = 0
    MaxDrop = 0
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
PROPERTIES
    EventuallySettled
CHECK_DEADLOCK FALSE
