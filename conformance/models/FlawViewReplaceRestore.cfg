\* expect: pass
\* module: MCViewNames.tla
\* Flaw 18: D/x replaced through the view by D/y, deletes.direct at restore: the copy replaced is the view's, and
\* the replacement reaches the other disk and is taken in; fixed on 2026-11-24 with the maintainer's remedy, a regression instance (README.md).
SPECIFICATION FairSpec
CONSTANTS
    NFolders = 1
    NNames = 2
    NFiles = 2
    StartPath <- TwoPath
    StartOn <- TwoOn
    StartDirs <- DirsD
    Direct = "restore"
    ViewActs = {"replace"}
    MaxView = 1
    UserActs = {}
    MaxUser = 0
    MaxStop = 0
    MaxDrop = 0
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
PROPERTIES
    EventuallySettled
CHECK_DEADLOCK FALSE
