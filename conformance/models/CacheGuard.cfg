\* expect: pass
\* The SSD cache's transfer with the link guard (§17, §19): a file on the cache disk 1 alone, a user copy, that leaves
\* it for the data disk 2; each pass that writes links each copy, so that a transfer a pass waited for finds the copy on
\* the cache linked, and its purge drops that link first, which would keep the data once purged and send it back to
\* the trash, deleted, at the next pass. Atoll killed once, a disk lost and mounted again once, a user acting once, on
\* either disk, at any moment.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 1
    Phys <- PhysTwo
    Start <- StartOne
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 6
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {"modify", "replace", "delete"}
    ViewActs = {}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 0
    CacheDisks = {1}
    Guard = "on"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv2_LastUserCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
CHECK_DEADLOCK FALSE
