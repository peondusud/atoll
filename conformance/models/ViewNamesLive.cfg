\* expect: pass
\* module: MCViewNames.tla
\* Liveness: ViewNames with deletes.direct at restore and no user: every operation of the view resolved and taken
\* in. It takes the remedies proposed for flaws 18 to 22, still open, so that it looks past them (README.md).
SPECIFICATION FairSpec
CONSTANTS
    NFolders = 1
    NNames = 2
    NFiles = 2
    StartPath <- TwoPath
    StartOn <- TwoOn
    StartDirs <- DirsD
    Direct = "restore"
    ViewActs = {"rename", "replace"}
    MaxView = 1
    UserActs = {}
    MaxUser = 0
    MaxStop = 1
    MaxDrop = 1
    Fixes = {"replace-gone", "folder-key", "view-moot", "job-view-held"}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
PROPERTIES
    EventuallySettled
CHECK_DEADLOCK FALSE
