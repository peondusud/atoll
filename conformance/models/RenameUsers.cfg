\* expect: pass
\* module: MCRename.tla
\* A file at A/x on two disks, and two user actions on either disk at any moment: renames either way, a new file, a
\* deletion, an edit, folders made, their modes changed, folders removed; Atoll killed once, the power cut once, a
\* disk lost once.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    Start <- StartBoth
    StartB <- BNone
    LinkDisks = {}
    MaxUser = 2
    MaxCrash = 1
    MaxCut = 1
    MaxDrop = 1
    MaxOps = 4
    UserActs = {"rename", "create", "delete", "replace", "edit", "mkdir", "chmod", "rmdir"}
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv4_UnknownNeverAbsent
    Inv7_RenameDurable
    Inv12_JournalFirst
    FolderNeverOpened
    UserFolderKept
    OneRowAnObject
    NamesKept
    RenamesAreUsers
CHECK_DEADLOCK FALSE
