\* expect: pass
\* module: MCCopies.tla
\* Liveness of copies at once: Atoll's passes run fairly. Two files, each on a disk with a spindle, each replicated to
\* one SSD that takes two copies at once, Atoll killed once while both may be under way: each file reaches its level,
\* and no operation stays planned (EventuallySettled).
SPECIFICATION FairSpec
CONSTANTS
    NDisks = 3
    NFiles = 2
    Size <- SizeOne
    Cap <- CapThree
    MinFree <- MinFreeOne
    Limit <- LimitSSD
    Total = 8
    Level = 2
    Start <- StartApart
    MaxUser = 0
    FillBy = 1
    MaxView = 0
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 0
    MaxOps = 6
    Fixes = {}
INVARIANTS
    TypeOK
    MinFreeKept
    CapacityKept
    Inv7_PipelineOrder
    Inv12_JournalFirst
PROPERTY
    EventuallySettled
CHECK_DEADLOCK FALSE
