\* expect: pass
\* module: MCGuards.tla
\* Liveness: both guards, a user deleting, putting back, rewriting, unmounting D, or the daemon stopping,
\* three times in all; the passes fair, and every guard answered: they settle.
SPECIFICATION LiveSpec
CONSTANTS
    NFiles = 2
    DelFiles = 1
    DelWin = 2
    ModFiles = 1
    ModWin = 1
    DayFiles = 9
    DayWin = 3
    UserActs = {"del", "back", "mod", "drop"}
    MaxUser = 3
    MaxTime = 3
    AnswerActs = {"dconfirm", "dreject", "mconfirm", "mreject"}
    Fixes = {}
INVARIANTS
    TypeOK
PROPERTIES
    EventuallySettled
CHECK_DEADLOCK FALSE
