\* expect: pass
\* module: MCScrub.tla
\* Disk 1's change time in whole ticks: a user editing its copy in place, keeping its modification time or not,
\* rot there; Atoll killed once: a mismatch there is a conflict.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    Coarse = {1}
    Unverified = {}
    Mode = "chunk"
    UserActs = {"keep", "edit"}
    UserDisks = {1}
    MaxUser = 1
    WorldActs = {"rot"}
    WorldDisks = {1}
    MaxWorld = 1
    AtollActs = {"scrub", "pass", "kill"}
    MaxKill = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoEditCalledCorrupt
    NoEditRepairedAway
    TrashFirst
    SourceVerified
    NoWrongVerify
    LastKept
    SoundNeverCorrupt
CHECK_DEADLOCK FALSE
