\* expect: liveness
\* Flaw 5 (README.md), open: an operation of Atoll's own view left planned on a disk lost while atoll mount runs, as
\* a file journaled there and not yet made when a USB disk resets, stays planned once the disk is back, for as long as
\* atoll mount runs, as §21.2 resolves it only at its next start: the daemon's walks wait at its path on that disk for
\* good, and no later operation of the view there is ever taken in (EventuallyViewTaken, EventuallySettled).
\* Fixes = {"view-reprise", "view-resolve", "view-recheck"} takes the remedy proposed, and passes (ViewLiveLost.cfg).
SPECIFICATION FairSpec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartNone
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 6
    Waits = FALSE
    Grace = FALSE
    Fixes = {"view-reprise", "view-resolve"}
    UserActs = {}
    ViewActs = {"create"}
    Parallel = TRUE
    MaxStop = 0
    MaxVOps = 3
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv7_PipelineOrder
    Inv12_JournalFirst
    ReplicaInSync
    ViewPresentsLatest
PROPERTY
    EventuallyViewTaken
    EventuallySettled
CHECK_DEADLOCK FALSE
