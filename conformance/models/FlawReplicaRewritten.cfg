\* expect: pass
\* The limit of flaw 1 (README.md), closed as the maintainer decided on 2026-11-20: a user writes into a replica once its
\* name is in the library, with a program that keeps the size and the dates, so that only the change time moves, while
\* Atoll is down after a crash or with the disk lost. The job records the change time the copy had right after the
\* rename, in a commit of its own (placed), and a reprise that finds another reads the write as an edit; one that finds
\* no record, the crash having come between the rename and that commit, records the copy unverified (§14.2). Until
\* then, the reprise took the change time it found, and the write was recorded as the copy itself, verified
\* (conformance/scenarios/replica-edited-keeping-dates-after-record.json, -before-record.json).
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartOne
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 3
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {"rewrite"}
    ViewActs = {}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 0
INVARIANTS
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    ReplicaInSync
    DoubtUnverified
CHECK_DEADLOCK FALSE
