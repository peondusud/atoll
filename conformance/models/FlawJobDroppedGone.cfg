\* expect: pass
\* Flaw 2 (README.md), fixed, through a deletion: a copy whose disk is lost after its rename and before its commit
\* leaves its operation planned and its job running; the user deletes the file's only other copy. The file waits for
\* its decisions while the job runs (§14.1, §15.12); until that remedy, the decision Gone dropped the file with that
\* job, and back, the disk's reprise finished the copy with no job and no file, leaving Atoll's copy in the library,
\* unknown to the catalog, for the next walk to take for a user's new file
\* (conformance/scenarios/replica-of-deleted-file.json).
