\* expect: Inv11_OwnOpsNotUsers
\* Flaw 2 (README.md), specs.md as it is: a copy whose disk is lost after its rename and
\* before its commit leaves its operation planned and its job running; the user deletes the file's only other copy,
\* and the decision Gone drops the file with that job (§15.12). Back, the disk's reprise finishes the copy with no job
\* and no file (§14.2), and leaves Atoll's copy in the library, unknown to the catalog: the next walk takes it for a
\* user's new file, and the file the user deleted is back (conformance/models/flaws/replica-of-deleted-file.json).
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 2
    Phys <- PhysTwo
    Start <- StartOne
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 0
    MaxCut = 0
    MaxDrop = 1
    MaxOps = 3
    Waits = TRUE
    Grace = FALSE
    Fixes = {}
    UserActs = {"delete"}
INVARIANTS
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    ReplicaInSync
CHECK_DEADLOCK FALSE
