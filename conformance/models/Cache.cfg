\* expect: pass
\* The SSD cache's transfer (§19): a file on the cache disk 1 alone, a user copy, that leaves it for the data disk 2:
\* its copy made there, then its user part handed over, its copy on the cache sent to the trash and purged at once.
\* Atoll killed once, the power cut once, a disk lost and mounted again once, a user acting once, on either disk, at any
\* moment. The remedies of flaws 8 to 10 in Fixes (README.md), so that it looks past them.
SPECIFICATION Spec
CONSTANTS
    NDisks = 2
    NFiles = 1
    Level = 1
    Phys <- PhysTwo
    Start <- StartOne
    LinkDisks = {}
    MaxUser = 1
    MaxCrash = 1
    MaxCut = 1
    MaxDrop = 1
    MaxOps = 4
    Waits = TRUE
    Grace = FALSE
    Fixes = {"xfer-look", "view-fallback", "view-held"}
    UserActs = {"modify", "replace", "delete", "create"}
    ViewActs = {}
    Parallel = FALSE
    MaxStop = 0
    MaxVOps = 0
    CacheDisks = {1}
    Guard = "none"
INVARIANTS
    TypeOK
    NoUserDataLost
    Inv1_LastVerifiedCopyKept
    Inv2_LastUserCopyKept
    Inv4_UnknownNeverAbsent
    Inv7_PipelineOrder
    Inv10_DeletionOnlyUnchangedToTrash
    Inv11_OwnOpsNotUsers
    Inv12_JournalFirst
    Inv13_OnePhysicalDisk
    ReplicaInSync
    DoubtUnverified
CHECK_DEADLOCK FALSE
