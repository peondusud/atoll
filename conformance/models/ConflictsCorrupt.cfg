\* expect: pass
\* module: MCConflicts.tla
\* Disk 1's copy rotted, disk 2's healthy, which the view presents; a user writing or
\* saving on either disk three times, a program writing through the view, a disk lost once; the
\* repair, by chunk, and once the file is a conflict, atoll conflicts resolve --keep either disk
\* (§16.1).
SPECIFICATION Spec
CONSTANTS
    StartVer <- VerTwo
    StartOrig = 2
    Corrupt = TRUE
    UserActs = {"write", "save"}
    MaxUser = 3
    MaxView = 1
    MaxDrop = 1
    Fixes = {}
INVARIANTS
    TypeOK
    NoVersionLost
    OnlyWhatItSays
    ViewNeverSentAway
CHECK_DEADLOCK FALSE
