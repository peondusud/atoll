\* expect: liveness
\* module: MCViewNames.tla
\* Flaw 20, open: D/x renamed through the view to D/y, which a user moves back directly before a pass takes the
\* rename in: it is never taken in, and the view presents the file at neither name (README.md). With view-moot in
\* Fixes, it passes.
SPECIFICATION FairSpec
CONSTANTS
    NFolders = 1
    NNames = 2
    NFiles = 1
    StartPath <- OnePath
    StartOn <- OneOn
    StartDirs <- DirsD
    Direct = "propagate"
    ViewActs = {"rename"}
    MaxView = 1
    UserActs = {"mv"}
    MaxUser = 1
    MaxStop = 0
    MaxDrop = 0
    Fixes = {}
INVARIANTS
    TypeOK
    NoUserDataLost
    ViewJournalTrue
    ViewNamesKept
PROPERTIES
    EventuallySettled
CHECK_DEADLOCK FALSE
