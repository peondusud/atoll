\* expect: pass
\* module: MCTrash.tla
\* atoll trash restore and the purge by expiry: a user deleting a copy, making a file at the path, editing, removing
\* or taking back by hand an entry of the trash, unmounting a disk, or Atoll killed, three times in all.
SPECIFICATION Spec
CONSTANTS
    NFiles = 1
    Level = 2
    Guard = FALSE
    UserActs = {"del", "new", "tedit", "trm", "tout", "lose", "stop"}
    MaxUser = 3
    AtollActs = {"pass", "restore", "purge"}
    MaxTime = 2
    Retention = 2
    NIno = 3
    MaxOps = 5
    Fixes = {}
INVARIANTS
    TypeOK
    NoKeptLost
    RestoreExact
    OneAtATime
    JournaledFirst
    PurgedStaysPurged
CHECK_DEADLOCK FALSE
