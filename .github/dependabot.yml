# Updates of the actions the workflows pin by commit, and of the Go modules, proposed once a week as pull requests to
# beta, where the work happens; the CI runs on each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
    # modernc.org/sqlite requires an exact libc and memory, and modernc advises against raising them on their own: they
    # follow sqlite, whose update brings the versions it needs (the maintainer, 2026-11-22 and 2026-11-26).
    ignore:
      - dependency-name: modernc.org/libc
      - dependency-name: modernc.org/memory
